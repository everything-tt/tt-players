name: Shared Frontend Packages

on:
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'packages/pwa/**'
      - '.github/workflows/design-system-package.yml'
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'packages/pwa/**'
      - '.github/workflows/design-system-package.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: shared-frontend-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '@tt-players/design-system'
            directory: 'design-system'
          - workspace: '@tt-players/pwa'
            directory: 'pwa'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wudong'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PWA package
        if: matrix.directory == 'pwa'
        run: pnpm --filter @tt-players/pwa test

      - name: Build publishable package
        run: pnpm --filter "${{ matrix.workspace }}" build

      - name: Inspect package contents
        run: npm pack "./packages/${{ matrix.directory }}/dist" --dry-run

      - name: Test published PWA package as a consumer
        if: matrix.directory == 'pwa'
        run: pnpm --filter @tt-players/pwa smoke:consumer

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          PACKAGE_ROOT="./packages/${PACKAGE_DIRECTORY}/dist"
          PACKAGE_NAME=$(node -p "require('${PACKAGE_ROOT}/package.json').name")
          PACKAGE_VERSION=$(node -p "require('${PACKAGE_ROOT}/package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- "packages/${PACKAGE_DIRECTORY}"; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published and this package did not change; skipping."
              exit 0
            fi
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists. Bump packages/${PACKAGE_DIRECTORY}/package.json before publishing another package change."
            exit 1
          fi

          npm publish "${PACKAGE_ROOT}" --registry=https://npm.pkg.github.com
