name: Scraping Hardening Gate

on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - '.github/workflows/scraping-hardening-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scraping-hardening-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_DATABASE_BASE_URL: postgres://postgres:postgres@localhost:5432
      NODE_ENV: test
      DB_LOAD_CHUNK_SIZE: '37'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run scraping hardening behavioral gate
        run: |
          pnpm --filter @tt-players/worker exec vitest run \
            src/__tests__/scrape-run*.test.ts \
            src/__tests__/raw-evidence-identity.test.ts \
            src/__tests__/source-rate-limit.integration.test.ts \
            src/__tests__/loader-concurrency.integration.test.ts \
            src/__tests__/sport80-event-claim.integration.test.ts \
            src/__tests__/anonymous-player-identity.integration.test.ts \
            src/__tests__/sport80-pagination.test.ts \
            src/__tests__/vetts-completeness.test.ts \
            src/__tests__/raw-scrape-retention.test.ts \
            src/__tests__/raw-retention-task.test.ts \
            src/__tests__/source-resource-scheduler.test.ts \
            src/__tests__/source-resource-scheduler-wiring.test.ts \
            src/__tests__/startup-source-independence.test.ts \
            src/__tests__/refresh-scrape-targets-task.test.ts \
            src/__tests__/tournament-candidate-policy.test.ts
