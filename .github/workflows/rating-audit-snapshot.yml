name: Refresh rating audit snapshot

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      model:
        description: Rating model key to audit
        required: true
        default: global-singles-glicko2-v1
        type: string

permissions:
  contents: read

concurrency:
  group: rating-audit-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_KEY: ${{ inputs.model || 'global-singles-glicko2-v1' }}
      API_BASE_URL: https://ttp-api.tourneypilot.com/api

    steps:
      - name: Validate model key
        run: |
          set -euo pipefail
          if [[ ! "$MODEL_KEY" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "Invalid rating model key: $MODEL_KEY" >&2
            exit 64
          fi

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify snapshot command is deployed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          ssh "$VPS_USER@$VPS_HOST" \
            "test -f /opt/tt-players/current/apps/worker/src/refresh-rating-audit-snapshot.ts && \
             test -x /opt/tt-players/current/apps/worker/node_modules/.bin/tsx"

      - name: Refresh snapshot
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" \
            "systemd-run \
              --quiet \
              --wait \
              --pipe \
              --collect \
              --unit=ttp-rating-audit-snapshot \
              --uid=ttp \
              --gid=ttp \
              --property=EnvironmentFile=/etc/ttp/worker.env \
              --property=WorkingDirectory=/opt/tt-players/current/apps/worker \
              /opt/tt-players/current/apps/worker/node_modules/.bin/tsx \
              src/refresh-rating-audit-snapshot.ts --model='$MODEL_KEY'" \
            | tee rating-audit-output.txt

          grep -q '^RATING_AUDIT_SNAPSHOT=' rating-audit-output.txt

      - name: Verify public snapshot
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$API_BASE_URL/ratings/audit/summary?model=$MODEL_KEY&run=$GITHUB_RUN_ID" \
            > rating-audit.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$API_BASE_URL/ratings/audit/issues?model=$MODEL_KEY&page_size=1&run=$GITHUB_RUN_ID" \
            > rating-audit-issues.json

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('rating-audit.json', 'utf8'));
          const issues = JSON.parse(fs.readFileSync('rating-audit-issues.json', 'utf8'));
          if (payload.model?.key !== process.env.MODEL_KEY) {
            throw new Error(`Unexpected model key: ${payload.model?.key}`);
          }
          const generatedAt = new Date(payload.generated_at).getTime();
          if (!Number.isFinite(generatedAt)) {
            throw new Error(`Invalid generated_at: ${payload.generated_at}`);
          }
          const ageMinutes = (Date.now() - generatedAt) / 60000;
          if (ageMinutes < -2 || ageMinutes > 15) {
            throw new Error(`Snapshot is not fresh: ${ageMinutes.toFixed(1)} minutes old`);
          }
          if (!issues.pagination || !Array.isArray(issues.summary)) {
            throw new Error('Audit issue response has an invalid shape');
          }
          console.log(`Verified snapshot generated at ${payload.generated_at}`);
          console.log(`Verified ${issues.pagination.total} active audit issues`);
          NODE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rating-audit-${{ github.run_id }}
          path: |
            rating-audit.json
            rating-audit-issues.json
            rating-audit-output.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Add workflow summary
        if: always()
        run: |
          {
            echo "## Rating audit snapshot"
            echo
            echo "- Model: \`$MODEL_KEY\`"
            echo "- Schedule: Mondays at 05:17 UTC"
          } >> "$GITHUB_STEP_SUMMARY"

          summary_line=$(grep '^RATING_AUDIT_SNAPSHOT=' rating-audit-output.txt 2>/dev/null | tail -n 1 || true)
          if [[ -n "$summary_line" ]]; then
            export SUMMARY_JSON="${summary_line#RATING_AUDIT_SNAPSHOT=}"
            node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(process.env.SUMMARY_JSON);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `- Generated at: \`${summary.generatedAt}\`\n` +
            `- Active issues: \`${summary.issueCount ?? 'unknown'}\`\n` +
            `- Data version: \`${summary.version}\`\n`
          );
          NODE
          fi
