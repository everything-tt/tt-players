name: Sync lifecycle refactor with main

on:
  push:
    branches:
      - perf/competition-search-cte
    paths:
      - '.github/workflows/sync-lifecycle-with-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/competition-search-cte
          fetch-depth: 0

      - name: Merge current main and sequence migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          unexpected="$(printf '%s\n' "$conflicts" | grep -v '^packages/db/src/__tests__/migration-preflight.test.ts$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if printf '%s\n' "$conflicts" | grep -q '^packages/db/src/__tests__/migration-preflight.test.ts$'; then
            git checkout --theirs packages/db/src/__tests__/migration-preflight.test.ts
            git add packages/db/src/__tests__/migration-preflight.test.ts
          elif [ "$merge_status" -ne 0 ]; then
            echo "Merge failed without a supported conflict"
            exit 1
          fi

          git mv \
            packages/db/src/migrations/046_separate_tournament_lifecycles.ts \
            packages/db/src/migrations/047_separate_tournament_lifecycles.ts

          python - <<'PY'
          from pathlib import Path

          preflight = Path('packages/db/src/__tests__/migration-preflight.test.ts')
          source = preflight.read_text()
          target = "            '046_create_scraping_pipeline_run_history',\n"
          addition = "            '047_separate_tournament_lifecycles',\n"
          if addition not in source:
              if target not in source:
                  raise SystemExit('Scraping history migration was not found in preflight order')
              source = source.replace(target, target + addition, 1)
          preflight.write_text(source)

          seed = Path('apps/api/src/__tests__/helpers/seed.ts')
          source = seed.read_text()
          source = source.replace('m046', 'm047')
          source = source.replace(
              '046_separate_tournament_lifecycles',
              '047_separate_tournament_lifecycles',
          )
          seed.write_text(source)
          PY

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved merge conflicts:"
            printf '%s\n' "$remaining"
            exit 1
          fi

          git rm .github/workflows/sync-lifecycle-with-main.yml
          git add apps/api packages/db apps/worker

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Commit merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync lifecycle refactor with main"
          git push origin HEAD:perf/competition-search-cte
