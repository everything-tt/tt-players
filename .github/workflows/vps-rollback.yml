name: Roll back VPS release

on:
  workflow_dispatch:
    inputs:
      target_release:
        description: "Use 'previous' or an already deployed commit SHA/prefix"
        required: true
        default: previous
        type: string

concurrency:
  group: vps-production-ttp
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Show current release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -eu
            echo "Current release:"
            cat /opt/tt-players/current/.release-metadata
            echo
            if [ -L /opt/tt-players/previous ]; then
              echo "Previous release:"
              cat /opt/tt-players/previous/.release-metadata
            else
              echo "Previous release: none"
            fi
          '

      - name: Roll back compatible release
        id: rollback_release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TARGET_RELEASE: ${{ inputs.target_release }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_RELEASE" != previous && ! "$TARGET_RELEASE" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "target_release must be 'previous' or a 7-40 character hexadecimal commit SHA/prefix" >&2
            exit 2
          fi
          printf -v target_q '%q' "$TARGET_RELEASE"
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/tt-players/current/scripts/rollback-vps-release.sh $target_q"

      - name: Verify production health
        id: health
        run: |
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health/db

      - name: Rollback summary
        if: always()
        env:
          TARGET_RELEASE: ${{ inputs.target_release }}
          ROLLBACK_OUTCOME: ${{ steps.rollback_release.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const runUrl = `${repositoryUrl}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const status = process.env.JOB_STATUS || 'unknown';
          const icon = status === 'success' ? '✅' : status === 'cancelled' ? '⚪' : '❌';

          const lines = [
            `## ${icon} VPS production rollback`,
            '',
            '| Phase | Result |',
            '| --- | --- |',
            `| Compatibility check and release switch | **${process.env.ROLLBACK_OUTCOME || 'not run'}** |`,
            `| Production health checks | **${process.env.HEALTH_OUTCOME || 'not run'}** |`,
            '',
            `- Requested target: \`${process.env.TARGET_RELEASE}\``,
            '- Health endpoints: [API](https://ttp-api.tourneypilot.com/api/health) · [Database](https://ttp-api.tourneypilot.com/api/health/db)',
            `- [Open workflow run](${runUrl})`,
            '',
          ];

          if (status !== 'success') {
            lines.push('> [!WARNING]');
            lines.push('> The rollback did not complete successfully. Check the failed phase and verify the active production release before retrying.');
            lines.push('');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
