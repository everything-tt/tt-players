<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TT Players full-codebase engineering and security audit, 6 August 2026.">
  <title>TT Players Engineering & Security Audit</title>
  <style>
    :root { color-scheme: light dark; --bg:#f6f8fa; --panel:#fff; --text:#1f2328; --muted:#59636e; --border:#d0d7de; --accent:#0969da; --code:#f6f8fa; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --panel:#151b23; --text:#f0f6fc; --muted:#9198a1; --border:#3d444d; --accent:#4493f8; --code:#161b22; } }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .topbar { position:sticky; top:0; z-index:10; border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter:blur(12px); }
    .topbar-inner { max-width:1060px; margin:auto; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { font-weight:700; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; font-size:14px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    main { max-width:1060px; margin:28px auto 80px; padding:0 24px; }
    .hero { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:28px; margin-bottom:22px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
    .eyebrow { color:var(--muted); font-size:14px; margin:0 0 6px; }
    .hero h1 { margin:0; font-size:clamp(28px,5vw,44px); line-height:1.12; letter-spacing:-.025em; }
    .hero p { color:var(--muted); margin:12px 0 0; }
    .report { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:clamp(20px,4vw,48px); box-shadow:0 1px 2px rgba(0,0,0,.04); overflow-wrap:anywhere; }
    .report h1,.report h2,.report h3,.report h4 { line-height:1.25; scroll-margin-top:78px; }
    .report h1 { margin-top:0; font-size:2rem; padding-bottom:.3em; border-bottom:1px solid var(--border); }
    .report h2 { margin-top:2em; padding-bottom:.3em; border-bottom:1px solid var(--border); }
    .report h3 { margin-top:1.6em; }
    .report table { border-collapse:collapse; display:block; width:max-content; max-width:100%; overflow:auto; }
    .report th,.report td { border:1px solid var(--border); padding:8px 12px; }
    .report th { background:var(--code); }
    .report pre { background:var(--code); border:1px solid var(--border); border-radius:8px; padding:16px; overflow:auto; }
    .report code { font:85% ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; background:var(--code); border-radius:5px; padding:.18em .36em; }
    .report pre code { background:transparent; padding:0; }
    .report blockquote { margin:1em 0; padding:.25em 1em; color:var(--muted); border-left:4px solid var(--border); }
    .report hr { border:0; border-top:1px solid var(--border); margin:2em 0; }
    .report img { max-width:100%; }
    .status { color:var(--muted); text-align:center; padding:48px 12px; }
    .error { border:1px solid #cf222e; border-radius:10px; padding:18px; }
    @media (max-width:640px) { .topbar-inner { align-items:flex-start; flex-direction:column; } main { padding:0 14px; } .hero { padding:20px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">TT Players Audit</div>
      <nav class="actions" aria-label="Page actions">
        <a href="graphile-worker/">Graphile Worker Guide</a>
        <a href="https://github.com/wudong/tt-players/blob/gh-pages/docs/audits/full-codebase-audit-2026-08-06.md">View Markdown on GitHub</a>
        <a href="https://github.com/wudong/tt-players">Repository</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Static source and configuration review · 6 August 2026</p>
      <h1>Engineering & Security Audit</h1>
      <p>Architecture, vulnerabilities, performance, technical debt, and a prioritised remediation plan for TT Players.</p>
    </section>
    <article id="report" class="report" aria-live="polite">
      <p class="status">Loading the audit report…</p>
    </article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script>
    const report = document.getElementById('report');
    const source = 'docs/audits/full-codebase-audit-2026-08-06.md';
    fetch(source, { cache: 'no-cache' })
      .then(response => {
        if (!response.ok) throw new Error(`Unable to load the report (${response.status})`);
        return response.text();
      })
      .then(markdown => {
        if (!window.marked || !window.DOMPurify) throw new Error('The Markdown renderer did not load');
        marked.use({ gfm: true, breaks: false });
        report.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        report.querySelectorAll('h1,h2,h3,h4').forEach((heading, index) => {
          const slug = heading.textContent.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || `section-${index + 1}`;
          heading.id = slug;
        });
      })
      .catch(error => {
        report.innerHTML = `<div class="error"><strong>The formatted report could not be loaded.</strong><p>${error.message}</p><p><a href="${source}">Open the Markdown report directly</a>.</p></div>`;
      });
  </script>
</body>
</html>
