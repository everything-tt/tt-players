name: Apply native search feature transform

on:
  push:
    branches:
      - design/native-search-browse-pages
    paths:
      - .github/apply-native-search.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/native-search-browse-pages
          fetch-depth: 0

      - name: Apply asserted transforms and commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/apply-native-search.mjs ]]; then
            echo "Transform already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .github/apply-native-search.mjs
          rm .github/apply-native-search.mjs
          git add -A
          git commit -m "feat: implement native paged search browse"
          git push origin HEAD:design/native-search-browse-pages
