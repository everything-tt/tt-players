name: Sync TTE Tournament Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: tte-calendar-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Verify scraper is deployed
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          ssh "$VPS_USER@$VPS_HOST" \
            "test -f /opt/tt-players/current/apps/worker/src/scrape-tte-events-once.ts"

      - name: Run full TTE calendar sync
        id: sync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" <<'REMOTE'
          set -euo pipefail
          systemd-run \
            --quiet \
            --wait \
            --pipe \
            --collect \
            --unit=ttp-tte-calendar-sync \
            --uid=ttp \
            --gid=ttp \
            --property=EnvironmentFile=/etc/ttp/worker.env \
            --property=WorkingDirectory=/opt/tt-players/current/apps/worker \
            /opt/tt-players/current/apps/worker/node_modules/.bin/tsx \
            src/scrape-tte-events-once.ts
          REMOTE

      - name: Verify live tournament endpoints
        id: verify
        env:
          API_BASE_URL: https://ttp-api.tourneypilot.com/api
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$API_BASE_URL/events?status=upcoming&limit=20&offset=0" > upcoming.json
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "$API_BASE_URL/events?status=completed&limit=20&offset=0" > completed.json

          node <<'NODE'
          const fs = require('node:fs');

          function validate(path, expectedStatus) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(payload.data)) throw new Error(`${path}: data must be an array`);
            if (!Number.isInteger(payload.total) || payload.total < 0) throw new Error(`${path}: total must be a non-negative integer`);
            if (payload.limit !== 20) throw new Error(`${path}: expected limit=20`);
            if (payload.offset !== 0) throw new Error(`${path}: expected offset=0`);
            for (const event of payload.data) {
              if (typeof event.id !== 'string' || typeof event.name !== 'string') {
                throw new Error(`${path}: event is missing id or name`);
              }
              if (expectedStatus === 'completed' && event.status !== 'completed') {
                throw new Error(`${path}: returned non-completed event ${event.id}`);
              }
              if (expectedStatus === 'upcoming' && !['upcoming', 'entries_open', 'entries_closed'].includes(event.status)) {
                throw new Error(`${path}: returned non-upcoming event ${event.id} with status ${event.status}`);
              }
            }
            return { total: payload.total, returned: payload.data.length };
          }

          const upcoming = validate('upcoming.json', 'upcoming');
          const completed = validate('completed.json', 'completed');
          const summary = { upcoming, completed };
          console.log(JSON.stringify(summary, null, 2));
          fs.writeFileSync('calendar-sync-summary.json', JSON.stringify(summary));
          NODE

      - name: Add calendar sync summary
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
          API_BASE_URL: https://ttp-api.tourneypilot.com/api
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          let counts;
          try {
            counts = JSON.parse(fs.readFileSync('calendar-sync-summary.json', 'utf8'));
          } catch {}

          const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const runUrl = `${repositoryUrl}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const status = process.env.JOB_STATUS || 'unknown';
          const icon = status === 'success' ? '✅' : status === 'cancelled' ? '⚪' : '❌';

          const lines = [
            `## ${icon} TTE tournament calendar sync`,
            '',
            '| Phase | Result |',
            '| --- | --- |',
            `| Full scraper sync | **${process.env.SYNC_OUTCOME || 'not run'}** |`,
            `| Public endpoint verification | **${process.env.VERIFY_OUTCOME || 'not run'}** |`,
          ];

          if (counts) {
            lines.push(
              `| Upcoming tournaments | ${counts.upcoming.total} total (${counts.upcoming.returned} checked) |`,
              `| Completed tournaments | ${counts.completed.total} total (${counts.completed.returned} checked) |`,
            );
          }

          lines.push(
            '',
            `- [Upcoming tournament API](${process.env.API_BASE_URL}/events?status=upcoming&limit=20&offset=0)`,
            `- [Completed tournament API](${process.env.API_BASE_URL}/events?status=completed&limit=20&offset=0)`,
            `- [Open workflow run](${runUrl})`,
            '',
          );

          if (status !== 'success') {
            lines.push('> [!WARNING]');
            lines.push('> The production calendar sync or its public verification failed. Review the failed phase before relying on refreshed tournament data.');
            lines.push('');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
