name: Roll back VPS release

on:
  workflow_dispatch:
    inputs:
      target_release:
        description: "Use 'previous' or an already deployed commit SHA/prefix"
        required: true
        default: previous
        type: string

concurrency:
  group: vps-production-ttp
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: wudong-agent-master
          workload_identity_provider: ${{ vars.TT_PLAYERS_SSH_WIF_PROVIDER }}
          service_account: ${{ vars.TT_PLAYERS_SSH_SERVICE_ACCOUNT }}

      - name: Load VPS deploy key
        id: gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            vps_ssh_key:wudong-agent-master/tt-players-hetzner-vps-deploy-key

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_HOST_KEY: ${{ vars.TT_PLAYERS_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ steps.gcp-secrets.outputs.vps_ssh_key }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Show current release
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" '
            set -eu
            echo "Current release:"
            cat /opt/tt-players/current/.release-metadata
            echo
            if [ -L /opt/tt-players/previous ]; then
              echo "Previous release:"
              cat /opt/tt-players/previous/.release-metadata
            else
              echo "Previous release: none"
            fi
          '

      - name: Roll back compatible release
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          TARGET_RELEASE: ${{ inputs.target_release }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_RELEASE" != previous && ! "$TARGET_RELEASE" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "target_release must be 'previous' or a 7-40 character hexadecimal commit SHA/prefix" >&2
            exit 2
          fi
          printf -v target_q '%q' "$TARGET_RELEASE"
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/tt-players/current/scripts/rollback-vps-release.sh $target_q"

      - name: Verify production health
        run: |
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health/db

      - name: Rollback summary
        env:
          TARGET_RELEASE: ${{ inputs.target_release }}
        run: |
          {
            echo "### VPS rollback"
            echo "- Requested target: \`$TARGET_RELEASE\`"
            echo "- Database compatibility checks: passed"
            echo "- Production health checks: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary SSH and Google credentials
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
