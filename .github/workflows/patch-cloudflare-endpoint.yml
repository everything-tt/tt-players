name: Patch Cloudflare embedding endpoint

on:
  push:
    branches: [fix/cloudflare-workers-ai-run-endpoint]
    paths:
      - '.github/workflows/patch-cloudflare-endpoint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-workers-ai-run-endpoint

      - name: Patch client and tests
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one {label} block, found {count}')
              return updated

          client_path = Path('apps/worker/src/event-embeddings.ts')
          client = client_path.read_text()

          client = replace_once(
              client,
              r"const CloudflareEmbeddingResponseSchema = z\.object\(\{.*?^\}\);",
              """const CloudflareEmbeddingResponseSchema = z.object({
              success: z.literal(true),
              result: z.object({
                  shape: z.array(z.number().int().nonnegative()).optional(),
                  data: z.union([
                      z.array(z.array(z.number())).min(1),
                      z.array(z.number()).min(1),
                  ]),
              }),
          });""",
              'response schema',
          )
          client = replace_once(
              client,
              r"function embeddingsEndpoint\(options: ResolvedCloudflareEmbeddingOptions\): string \{.*?^\}",
              """function embeddingsEndpoint(options: ResolvedCloudflareEmbeddingOptions): string {
              return `${options.apiBaseUrl}/accounts/${encodeURIComponent(options.accountId)}/ai/run/${options.model}`;
          }""",
              'endpoint',
          )
          client = replace_once(
              client,
              r"body: JSON\.stringify\(\{\s*model: options\.model,\s*input: inputTexts,\s*encoding_format: 'float',\s*\}\),",
              """body: JSON.stringify({
                              text: inputTexts,
                          }),""",
              'request body',
          )
          client = replace_once(
              client,
              r"const parsed = CloudflareEmbeddingResponseSchema\.parse\(\s*await response\.json\(\),\s*\);\s*const ordered = \[\.\.\.parsed\.data\]\.sort\(.*?return item\.embedding;\s*\}\);",
              """const parsed = CloudflareEmbeddingResponseSchema.parse(
                              await response.json(),
                          );
                          const rawData = parsed.result.data;
                          const vectors = Array.isArray(rawData[0])
                              ? rawData as number[][]
                              : [rawData as number[]];
                          if (vectors.length !== inputTexts.length) {
                              throw new Error(
                                  `Cloudflare embeddings response returned ${vectors.length} vectors for ${inputTexts.length} inputs`,
                              );
                          }

                          return vectors.map((embedding) => {
                              if (embedding.length !== options.dimensions) {
                                  throw new Error(
                                      `Cloudflare embedding has ${embedding.length} dimensions; expected ${options.dimensions}`,
                                  );
                              }
                              return embedding;
                          });""",
              'response parser',
          )
          client_path.write_text(client)

          test_path = Path('apps/worker/src/__tests__/event-embeddings.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "it('calls the Cloudflare OpenAI-compatible endpoint in a batch', async () => {",
              "it('calls the Cloudflare Workers AI model endpoint in a batch', async () => {",
          )
          test = test.replace(
              "https://api.cloudflare.test/client/v4/accounts/account-123/ai/v1/embeddings",
              "https://api.cloudflare.test/client/v4/accounts/account-123/ai/run/@cf/baai/bge-small-en-v1.5",
          )
          test = replace_once(
              test,
              r"const body = JSON\.parse\(init\.body\) as Record<string, unknown>;\s*expect\(body\)\.toMatchObject\(\{.*?expect\(body\.input\)\.toEqual\(\[.*?\]\);",
              """const body = JSON.parse(init.body) as Record<string, unknown>;
                      expect(body).toEqual({
                          text: [
                              'table tennis tournament: first open',
                              'table tennis tournament: second open',
                          ],
                      });""",
              'test request assertion',
          )
          test = replace_once(
              test,
              r"json: async \(\) => \(\{\s*data: \[\s*\{ index: 1, embedding: \[0, 1\] \},\s*\{ index: 0, embedding: \[1, 0\] \},\s*\],\s*\}\),",
              """json: async () => ({
                              success: true,
                              result: {
                                  shape: [2, 2],
                                  data: [
                                      [1, 0],
                                      [0, 1],
                                  ],
                                  pooling: 'mean',
                              },
                              errors: [],
                              messages: [],
                          }),""",
              'test response',
          )
          test_path.write_text(test)

          Path('.github/workflows/patch-cloudflare-endpoint.yml').unlink()
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/worker/src/event-embeddings.ts apps/worker/src/__tests__/event-embeddings.test.ts .github/workflows/patch-cloudflare-endpoint.yml
          git commit -m 'fix: use Cloudflare Workers AI model endpoint'
          git push origin HEAD:fix/cloudflare-workers-ai-run-endpoint
