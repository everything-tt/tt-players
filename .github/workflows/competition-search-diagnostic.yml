name: Competition search diagnostic

on:
  push:
    branches:
      - perf/competition-search-diagnostic
    paths:
      - '.github/workflows/competition-search-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Explain literal candidate ID queries
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sql_file=$(mktemp --suffix=.sql)
          cat > "$sql_file" <<'SQL'
          DO $$
          DECLARE
            candidate_ids text;
            page_ids text;
            plan_line text;
          BEGIN
            SELECT string_agg(format('%L::uuid', id::text), ',')
            INTO candidate_ids
            FROM (
              SELECT c.id
              FROM competitions c
              WHERE c.type = 'individual'
                AND c.deleted_at IS NULL
                AND c.event_status = 'completed'
                AND coalesce(c.display_name, c.name) ILIKE '%open%'
              ORDER BY
                coalesce(c.start_date, c.event_date) DESC,
                coalesce(c.display_name, c.name) ASC,
                c.id ASC
              LIMIT 100
            ) candidates;

            RAISE NOTICE 'DIRECT ELIGIBILITY PLAN';
            FOR plan_line IN EXECUTE format(
              'EXPLAIN (ANALYZE, BUFFERS, SETTINGS) '
              'SELECT f.competition_id AS id '
              'FROM fixtures f '
              'JOIN rubbers r ON r.fixture_id = f.id '
              'WHERE f.competition_id IN (%s) '
              'AND f.deleted_at IS NULL '
              'AND r.deleted_at IS NULL '
              'AND r.is_doubles = false '
              'GROUP BY f.competition_id',
              candidate_ids
            ) LOOP
              RAISE NOTICE '%', plan_line;
            END LOOP;

            SELECT string_agg(format('%L::uuid', id::text), ',')
            INTO page_ids
            FROM (
              WITH candidates AS MATERIALIZED (
                SELECT
                  c.id,
                  row_number() OVER (
                    ORDER BY
                      coalesce(c.start_date, c.event_date) DESC,
                      coalesce(c.display_name, c.name) ASC,
                      c.id ASC
                  ) AS ordinal
                FROM competitions c
                WHERE c.type = 'individual'
                  AND c.deleted_at IS NULL
                  AND c.event_status = 'completed'
                  AND coalesce(c.display_name, c.name) ILIKE '%open%'
                ORDER BY
                  coalesce(c.start_date, c.event_date) DESC,
                  coalesce(c.display_name, c.name) ASC,
                  c.id ASC
                LIMIT 100
              ), eligible AS MATERIALIZED (
                SELECT DISTINCT f.competition_id
                FROM fixtures f
                JOIN rubbers r ON r.fixture_id = f.id
                WHERE f.competition_id IN (SELECT id FROM candidates)
                  AND f.deleted_at IS NULL
                  AND r.deleted_at IS NULL
                  AND r.is_doubles = false
              )
              SELECT candidate.id
              FROM candidates candidate
              JOIN eligible ON eligible.competition_id = candidate.id
              ORDER BY candidate.ordinal
              LIMIT 10
            ) page;

            RAISE NOTICE 'DIRECT ENRICHMENT PLAN';
            FOR plan_line IN EXECUTE format(
              'EXPLAIN (ANALYZE, BUFFERS, SETTINGS) '
              'SELECT c.id, '
              '(SELECT count(*) FROM fixtures f JOIN rubbers r ON r.fixture_id = f.id '
              ' WHERE f.competition_id = c.id AND f.deleted_at IS NULL '
              ' AND r.deleted_at IS NULL AND r.is_doubles = false) AS match_count, '
              '(SELECT count(*) FROM tournament_sources ts WHERE ts.competition_id = c.id) AS source_count, '
              '(SELECT nullif(ts.raw_payload ->> ''description'', '''') FROM tournament_sources ts '
              ' WHERE ts.competition_id = c.id AND ts.source_type = ''calendar'' '
              ' ORDER BY ts.last_seen_at DESC LIMIT 1) AS description, '
              '(SELECT nullif(ts.raw_payload ->> ''venueUrl'', '''') FROM tournament_sources ts '
              ' WHERE ts.competition_id = c.id AND ts.source_type = ''calendar'' '
              ' ORDER BY ts.last_seen_at DESC LIMIT 1) AS venue_url, '
              '(SELECT nullif(ts.raw_payload ->> ''organizerName'', '''') FROM tournament_sources ts '
              ' WHERE ts.competition_id = c.id AND ts.source_type = ''calendar'' '
              ' ORDER BY ts.last_seen_at DESC LIMIT 1) AS organizer_name, '
              '(SELECT nullif(ts.raw_payload ->> ''organizerUrl'', '''') FROM tournament_sources ts '
              ' WHERE ts.competition_id = c.id AND ts.source_type = ''calendar'' '
              ' ORDER BY ts.last_seen_at DESC LIMIT 1) AS organizer_url, '
              '(SELECT ts.source_url FROM tournament_sources ts '
              ' WHERE ts.competition_id = c.id AND ts.source_type = ''results'' '
              ' ORDER BY ts.last_seen_at DESC LIMIT 1) AS result_url '
              'FROM competitions c '
              'JOIN seasons s ON s.id = c.season_id '
              'JOIN leagues l ON l.id = s.league_id '
              'JOIN platforms p ON p.id = l.platform_id '
              'WHERE c.id IN (%s)',
              page_ids
            ) LOOP
              RAISE NOTICE '%', plan_line;
            END LOOP;
          END $$;
          SQL
          chown ttp:ttp "$sql_file"
          chmod 600 "$sql_file"
          systemd-run \
            --quiet \
            --wait \
            --pipe \
            --collect \
            --unit=ttp-competition-search-literal-diagnostic \
            --uid=ttp \
            --gid=ttp \
            --property=EnvironmentFile=/etc/ttp/api.env \
            /bin/bash -lc '/usr/bin/psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$1"' bash "$sql_file"
          rm -f "$sql_file"
          REMOTE
