name: Deploy API and Database to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/benchmark-api.mjs'
      - 'scripts/capture-query-plans.mjs'
      - 'scripts/__tests__/**'
      - 'scripts/lib/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/backup-vps-postgres.sh'
      - 'scripts/verify-vps-postgres-backup.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'packages/db/**'
      - 'packages/ranking/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
  workflow_dispatch:

concurrency:
  group: vps-production-ttp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Validate deployment scripts and backup units
        run: |
          bash -n scripts/lib/service-recovery.sh
          bash -n scripts/backup-vps-postgres.sh
          bash -n scripts/verify-vps-postgres-backup.sh
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
          systemd-analyze verify \
            infra/systemd/ttp-db-backup.service \
            infra/systemd/ttp-db-backup.timer

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Configure API authentication
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          url_b64=$(printf '%s' "$SUPABASE_URL" | base64 -w 0)
          key_b64=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | base64 -w 0)

          ssh "$VPS_USER@$VPS_HOST" \
            "SUPABASE_URL_B64='$url_b64' SUPABASE_KEY_B64='$key_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/api.env
          temp_file=$(mktemp)
          grep -v -E '^SUPABASE_(URL|PUBLISHABLE_KEY)=' "$env_file" > "$temp_file" || true
          printf 'SUPABASE_URL=%s\n' "$(printf '%s' "$SUPABASE_URL_B64" | base64 -d)" >> "$temp_file"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$(printf '%s' "$SUPABASE_KEY_B64" | base64 -d)" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          rm -f "$temp_file"
          REMOTE

      - name: Configure worker embedding credentials
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"

          token_b64=$(printf '%s' "$CLOUDFLARE_AI_API_TOKEN" | base64 -w 0)
          account_b64=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | base64 -w 0)

          ssh "$VPS_USER@$VPS_HOST" \
            "CLOUDFLARE_TOKEN_B64='$token_b64' CLOUDFLARE_ACCOUNT_B64='$account_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          temp_file=$(mktemp)
          if [[ -f "$env_file" ]]; then
            grep -v -E '^CLOUDFLARE_(API_TOKEN|ACCOUNT_ID)=' "$env_file" > "$temp_file" || true
          fi
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$(printf '%s' "$CLOUDFLARE_TOKEN_B64" | base64 -d)" >> "$temp_file"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_B64" | base64 -d)" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          rm -f "$temp_file"
          REMOTE

      - name: Configure Ollama form analysis
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_API_KEY"
          key_b64=$(printf '%s' "$OLLAMA_API_KEY" | base64 -w 0)

          ssh "$VPS_USER@$VPS_HOST" \
            "OLLAMA_KEY_B64='$key_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          temp_file=$(mktemp)
          if [[ -f "$env_file" ]]; then
            grep -v -E '^(OLLAMA_API_KEY|DEEPSEEK_API_KEY|ENTRY_FORM_LLM_(BASE_URL|MODEL|API_KEY))=' "$env_file" > "$temp_file" || true
          fi
          printf 'OLLAMA_API_KEY=%s\n' "$(printf '%s' "$OLLAMA_KEY_B64" | base64 -d)" >> "$temp_file"
          printf 'ENTRY_FORM_LLM_BASE_URL=https://api.ollama.com\n' >> "$temp_file"
          printf 'ENTRY_FORM_LLM_MODEL=deepseek-v4-flash:0731\n' >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          rm -f "$temp_file"
          REMOTE

      - name: Determine database compatibility boundary
        id: database
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          current_sha=$(ssh "$VPS_USER@$VPS_HOST" \
            "sed -n 's/^commit_sha=//p' /opt/tt-players/current/.release-metadata 2>/dev/null | head -n 1" || true)

          database_changed=true
          if [[ -n "$current_sha" ]] && git cat-file -e "$current_sha^{commit}" 2>/dev/null; then
            if git diff --quiet "$current_sha" "$GITHUB_SHA" -- \
              packages/db \
              scripts/migrate-vps-postgres.sh \
              infra/postgres; then
              database_changed=false
            fi
          fi

          db_fingerprint=$(git ls-tree -r "$GITHUB_SHA" -- \
            packages/db \
            scripts/migrate-vps-postgres.sh \
            infra/postgres | sha256sum | awk '{print $1}')

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"
          echo "db_fingerprint=$db_fingerprint" >> "$GITHUB_OUTPUT"

          if [[ "$database_changed" == true ]]; then
            echo "::warning::Database files changed. This deployment creates a forward-only boundary and cannot be rolled back."
          else
            echo "Database fingerprint is unchanged; a manual rollback to a compatible deployed release will remain available."
          fi

      - name: Upload versioned release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "mkdir -p /opt/tt-players/releases/$RELEASE_SHA"

          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude test-results \
            --exclude .env \
            --exclude docker-compose.yml \
            --exclude backups \
            --exclude .playwright-cli \
            --exclude '*.dump' \
            ./ "$VPS_USER@$VPS_HOST:/opt/tt-players/releases/$RELEASE_SHA/"

      - name: Activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/tt-players/releases/$RELEASE_SHA/scripts/deploy-vps-release.sh \
              /opt/tt-players/releases/$RELEASE_SHA \
              '$RELEASE_SHA' \
              '$DB_FINGERPRINT' \
              '$DATABASE_CHANGED'"

      - name: Verify production health
        run: |
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health/db

      - name: Deployment summary
        env:
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          {
            echo "### VPS release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Database changed: \`$DATABASE_CHANGED\`"
            echo "- Database fingerprint: \`$DB_FINGERPRINT\`"
            echo "- Cloudflare worker credentials: configured from \`CLOUDFLARE_ACCOUNT_ID\` and \`CLOUDFLARE_AI_API_TOKEN\`"
            echo "- Ollama form analysis: configured from \`OLLAMA_API_KEY\` using \`deepseek-v4-flash:0731\`"
            if [[ "$DATABASE_CHANGED" == true ]]; then
              echo "- Rollback: **disabled**; recovery is forward-only"
            else
              echo "- Rollback: available through the manual VPS rollback workflow for compatible releases"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
