# Netlify configuration for TT Players.
#
# GitHub Actions deploys apps/mobile/dist plus netlify/functions directly.
# Keep routing changes mirrored in apps/mobile/public/_redirects so the published
# artifact and netlify.toml preserve the same first-match order.

[build]
  command = "echo 'Build handled by GitHub Actions'"
  publish = "apps/mobile/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# player-ssr requires the server-only Netlify runtime environment variable
# SSR_API_ORIGIN. Example local value: https://api.example.test
# It is intentionally not exposed as VITE_* and is not hard-coded here.

# 1. Browser SPA API proxy. Keep this before all broad rewrites.
[[redirects]]
  from = "/api/*"
  to = "https://ttp-api.tourneypilot.com/api/:splat"
  status = 200
  force = true

# 2. Only the canonical public player profile is SSR. Deeper player routes and
# all /tabs/* routes continue through the SPA fallback below.
[[redirects]]
  from = "/players/:playerId"
  to = "/.netlify/functions/player-ssr?playerId=:playerId"
  status = 200
  force = true

# 3. SPA fallback for every other document route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for hashed assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"