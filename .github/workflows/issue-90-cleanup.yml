name: Apply issue 90 cleanup

on:
  push:
    branches:
      - fix/issue-90-player-search-page-first

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean generated source and test formatting
        run: python scripts/issue-90-cleanup.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check API
        run: pnpm --filter @tt-players/api build

      - name: Run page-first query-shape regression test
        run: pnpm --filter @tt-players/api exec vitest run src/__tests__/player-search-query-shape.test.ts

      - name: Commit formatting cleanup
        run: |
          rm scripts/issue-90-cleanup.py
          rm .github/workflows/issue-90-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/players.ts \
                  apps/api/src/__tests__/search-pagination.integration.test.ts \
                  apps/api/src/__tests__/player-search-query-shape.test.ts \
                  scripts/issue-90-cleanup.py \
                  .github/workflows/issue-90-cleanup.yml
          git commit -m "style(api): clean player search optimization"
          git push origin HEAD
