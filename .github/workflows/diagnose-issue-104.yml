name: Diagnose player identity aliases

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/worker/src/diagnose-player-rubber-identity.ts'
      - 'apps/worker/src/diagnose-player-name-aliases.ts'
      - 'apps/worker/src/repair-soft-deleted-player-aliases.ts'
      - '.github/workflows/diagnose-issue-104.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-issue-104-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/diagnose-issue-104-player-links'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      RUBBER_ID: de2f7e61-c727-4829-a82a-0d4b1ae89ee5
      EXPECTED_PLAYER_IDS: d0f7992f-bd3b-438c-874d-0af41d16a712,b3fa804d-05ee-465f-b508-dcbca48758c7
      PLAYER_NAME: Grace Liu

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Run read-only production diagnostics and corrected preview
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_USER"

          diagnostic_name=".diagnose-player-rubber-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          player_name_diagnostic_name=".diagnose-player-name-aliases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          repair_name=".repair-soft-deleted-player-aliases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ts"
          diagnostic_path="/opt/tt-players/current/apps/worker/src/$diagnostic_name"
          player_name_diagnostic_path="/opt/tt-players/current/apps/worker/src/$player_name_diagnostic_name"
          repair_path="/opt/tt-players/current/apps/worker/src/$repair_name"

          cleanup() {
            ssh "$VPS_USER@$VPS_HOST" "rm -f '$diagnostic_path' '$player_name_diagnostic_path' '$repair_path'" || true
          }
          trap cleanup EXIT

          scp apps/worker/src/diagnose-player-rubber-identity.ts \
            "$VPS_USER@$VPS_HOST:$diagnostic_path"
          scp apps/worker/src/diagnose-player-name-aliases.ts \
            "$VPS_USER@$VPS_HOST:$player_name_diagnostic_path"
          scp apps/worker/src/repair-soft-deleted-player-aliases.ts \
            "$VPS_USER@$VPS_HOST:$repair_path"

          ssh "$VPS_USER@$VPS_HOST" \
            "systemd-run \
              --quiet \
              --wait \
              --pipe \
              --collect \
              --unit=ttp-player-identity-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
              --uid=ttp \
              --gid=ttp \
              --property=EnvironmentFile=/etc/ttp/worker.env \
              --property=WorkingDirectory=/opt/tt-players/current/apps/worker \
              /opt/tt-players/current/apps/worker/node_modules/.bin/tsx \
              src/$diagnostic_name \
              --rubber-id $RUBBER_ID \
              --expected-player-ids $EXPECTED_PLAYER_IDS" \
            | tee diagnostic-output.txt

          ssh "$VPS_USER@$VPS_HOST" \
            "systemd-run \
              --quiet \
              --wait \
              --pipe \
              --collect \
              --unit=ttp-player-name-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
              --uid=ttp \
              --gid=ttp \
              --property=EnvironmentFile=/etc/ttp/worker.env \
              --property=WorkingDirectory=/opt/tt-players/current/apps/worker \
              /opt/tt-players/current/apps/worker/node_modules/.bin/tsx \
              src/$player_name_diagnostic_name \
              --player-name \"$PLAYER_NAME\"" \
            | tee player-name-diagnostic-output.txt

          ssh "$VPS_USER@$VPS_HOST" \
            "systemd-run \
              --quiet \
              --wait \
              --pipe \
              --collect \
              --unit=ttp-player-alias-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
              --uid=ttp \
              --gid=ttp \
              --property=EnvironmentFile=/etc/ttp/worker.env \
              --property=WorkingDirectory=/opt/tt-players/current/apps/worker \
              /opt/tt-players/current/apps/worker/node_modules/.bin/tsx \
              src/$repair_name \
              --all" \
            | tee repair-preview-output.txt

      - name: Add diagnostic summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Player identity diagnostics"
            echo
            echo "- PR branch: \`$GITHUB_HEAD_REF\`"
            echo "- Issue 104 rubber: \`$RUBBER_ID\`"
            echo "- Expected players: \`$EXPECTED_PLAYER_IDS\`"
            echo "- Name probe: \`$PLAYER_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

          diagnostic_summary=$(grep '^IDENTITY_DIAGNOSTIC_SUMMARY=' diagnostic-output.txt 2>/dev/null | tail -n 1 || true)
          if [[ -n "$diagnostic_summary" ]]; then
            export DIAGNOSTIC_JSON="${diagnostic_summary#IDENTITY_DIAGNOSTIC_SUMMARY=}"
            node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(process.env.DIAGNOSTIC_JSON);
          const lines = [
            `- Rubber deleted: ${summary.rubberDeleted}`,
            `- Fixture deleted: ${summary.fixtureDeleted}`,
            `- Participant IDs: ${summary.participantIds.map((id) => `\`${id}\``).join(', ') || 'none'}`,
          ];
          for (const player of summary.expectedPlayers) {
            lines.push(
              `- Expected \`${player.expectedPlayerId}\`: resolves=${player.resolves}, canonical=\`${player.canonicalId ?? 'none'}\`, represented=${player.representedInRubber}, matching IDs=${player.matchingRubberParticipantIds.join(', ') || 'none'}`,
            );
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          fi

          player_name_summary=$(grep '^PLAYER_NAME_DIAGNOSTIC_SUMMARY=' player-name-diagnostic-output.txt 2>/dev/null | tail -n 1 || true)
          if [[ -n "$player_name_summary" ]]; then
            export PLAYER_NAME_JSON="${player_name_summary#PLAYER_NAME_DIAGNOSTIC_SUMMARY=}"
            node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(process.env.PLAYER_NAME_JSON);
          const lines = [
            '',
            `## ${summary.playerName} diagnostic`,
            '',
            `- Matching rows: ${summary.matchingRowCount}`,
            `- Eligible for current repair: ${summary.eligibleRowCount}`,
          ];
          for (const row of summary.rows) {
            lines.push(
              `- \`${row.id}\` (${row.platform ?? 'unknown platform'}): deleted=${row.deleted}, canonical=\`${row.canonicalPlayerId ?? 'none'}\`, root=\`${row.rootId ?? 'none'}\`, eligible=${row.eligibleForCurrentRepair}, exclusions=${row.exclusionReasons.join(', ') || 'none'}, active rubber refs=${row.referenceCounts.activeRubbers}`,
            );
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          fi

          repair_summary=$(grep '^ALIAS_REPAIR_SUMMARY=' repair-preview-output.txt 2>/dev/null | tail -n 1 || true)
          if [[ -n "$repair_summary" ]]; then
            export REPAIR_JSON="${repair_summary#ALIAS_REPAIR_SUMMARY=}"
            node <<'NODE'
          const fs = require('node:fs');
          const summary = JSON.parse(process.env.REPAIR_JSON);
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `\n## Corrected all-player preview\n\n` +
            `- Eligible aliases: ${summary.candidateCount}\n` +
            `- Affected canonical players: ${summary.canonicalPlayerCount}\n` +
            `- Referenced rubber links: ${summary.referencedRubberLinks}\n` +
            `- Restored aliases: ${summary.restoredAliasCount}\n`,
          );
          NODE
          fi

          for output in diagnostic-output.txt player-name-diagnostic-output.txt repair-preview-output.txt; do
            if [[ -f "$output" ]]; then
              {
                echo
                echo "<details><summary>Full $output</summary>"
                echo
                echo '```json'
                sed -n '1,720p' "$output"
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
