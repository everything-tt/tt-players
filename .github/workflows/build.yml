name: Build and Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-design-system-netlify:
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: wudong-agent-master
          workload_identity_provider: ${{ vars.TT_PLAYERS_FRONTEND_WIF_PROVIDER }}
          service_account: ${{ vars.TT_PLAYERS_FRONTEND_SERVICE_ACCOUNT }}

      - name: Load production Netlify credential
        id: gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            netlify_auth_token:wudong-agent-master/tt-players-netlify-auth-token

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build design system showcase
        run: |
          set -euo pipefail
          rm -rf design-system
          git clone --depth 1 https://github.com/everything-tt/tt-design-system.git design-system
          cd design-system
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm demo:typecheck
          pnpm demo:build
          test -f examples/showcase/dist/index.html

      - name: Create or reuse Netlify site and deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.gcp-secrets.outputs.netlify_auth_token }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/design-system-site.json
          const token = process.env.NETLIFY_AUTH_TOKEN;
          if (!token) throw new Error('Missing NETLIFY_AUTH_TOKEN');
          const headers = { Authorization: `Bearer ${token}` };
          const list = await fetch('https://api.netlify.com/api/v1/sites?per_page=100', { headers });
          if (!list.ok) throw new Error(`Netlify list failed: ${list.status} ${await list.text()}`);
          const sites = await list.json();
          let site = sites.find((item) => item.name === 'everything-tt-design-system');
          if (!site) {
            const create = await fetch('https://api.netlify.com/api/v1/sites', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: 'everything-tt-design-system' }),
            });
            if (!create.ok) throw new Error(`Netlify create failed: ${create.status} ${await create.text()}`);
            site = await create.json();
          }
          console.log(JSON.stringify({ id: site.id, url: site.ssl_url || site.url }));
          NODE

          SITE_ID=$(node -p "require('/tmp/design-system-site.json').id")
          SITE_URL=$(node -p "require('/tmp/design-system-site.json').url")
          echo "SITE_ID=$SITE_ID"
          echo "SITE_URL=$SITE_URL"

          (
            cd design-system/examples/showcase
            NETLIFY_AUTH_TOKEN="$NETLIFY_AUTH_TOKEN" npx --yes netlify-cli@latest deploy \
              --dir=dist \
              --site="$SITE_ID" \
              --prod \
              --message="Design system production bootstrap"
          )

          echo "### Design system Netlify" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site ID: $SITE_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Try durable Secret Manager provisioning
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.gcp-secrets.outputs.netlify_auth_token }}
        run: |
          set -euo pipefail
          if ! command -v gcloud >/dev/null 2>&1; then
            echo 'gcloud CLI is not installed on this runner; no durable design-system secret was created.'
            exit 0
          fi
          SECRET=tt-design-system-netlify-auth-token
          if gcloud secrets describe "$SECRET" --project=wudong-agent-master >/dev/null 2>&1; then
            printf '%s' "$NETLIFY_AUTH_TOKEN" | gcloud secrets versions add "$SECRET" --project=wudong-agent-master --data-file=- >/dev/null
            echo 'Updated existing tt-design-system-netlify-auth-token.'
          elif gcloud secrets create "$SECRET" --project=wudong-agent-master --replication-policy=automatic >/dev/null 2>&1; then
            printf '%s' "$NETLIFY_AUTH_TOKEN" | gcloud secrets versions add "$SECRET" --project=wudong-agent-master --data-file=- >/dev/null
            echo 'Created tt-design-system-netlify-auth-token.'
          else
            echo 'Current frontend reader cannot create Secret Manager secrets; IAM was not broadened.'
          fi

      - name: Clean temporary Google credentials
        if: always()
        run: |
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
