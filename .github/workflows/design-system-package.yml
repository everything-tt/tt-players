name: Shared Packages

on:
  pull_request:
    paths:
      - 'packages/design-system/**'
      - 'packages/pwa/**'
      - 'libs/ranking/**'
      - '.github/workflows/design-system-package.yml'
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'
      - 'packages/pwa/**'
      - 'libs/ranking/**'
      - '.github/workflows/design-system-package.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: shared-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: workspace
            workspace: '@tt-players/design-system'
            package_path: 'packages/design-system'
          - kind: workspace
            workspace: '@tt-players/pwa'
            package_path: 'packages/pwa'
          - kind: ranking
            workspace: ''
            package_path: 'libs/ranking'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wudong'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test PWA package
        if: matrix.package_path == 'packages/pwa'
        run: pnpm --filter @tt-players/pwa test

      - name: Build workspace package
        if: matrix.kind == 'workspace'
        run: pnpm --filter "${{ matrix.workspace }}" build

      - name: Build ranking package
        if: matrix.kind == 'ranking'
        run: |
          pnpm --filter @tt-players/worker exec tsc -p ../../libs/ranking/tsconfig.build.json
          node ./libs/ranking/scripts/prepare-package.mjs

      - name: Test ranking package
        if: matrix.kind == 'ranking'
        run: node --test ./libs/ranking/tests/*.test.mjs

      - name: Inspect package contents
        run: npm pack "./${{ matrix.package_path }}/dist" --dry-run

      - name: Test published PWA package as a consumer
        if: matrix.package_path == 'packages/pwa'
        run: pnpm --filter @tt-players/pwa smoke:consumer

      - name: Test published ranking package as a consumer
        if: matrix.kind == 'ranking'
        run: node ./libs/ranking/scripts/consumer-smoke.mjs

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_PATH: ${{ matrix.package_path }}
        shell: bash
        run: |
          PACKAGE_ROOT="./${PACKAGE_PATH}/dist"
          PACKAGE_NAME=$(node -p "require('${PACKAGE_ROOT}/package.json').name")
          PACKAGE_VERSION=$(node -p "require('${PACKAGE_ROOT}/package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- "${PACKAGE_PATH}"; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published and this package did not change; skipping."
              exit 0
            fi
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists. Bump ${PACKAGE_PATH}/package.json before publishing another package change."
            exit 1
          fi

          npm publish "${PACKAGE_ROOT}" --registry=https://npm.pkg.github.com
