      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          pnpm --filter @tt-players/api test -- events-lifecycle.test.ts events-pagination-query-shape.test.ts
          pnpm run check:backend

      - name: Commit review fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lifecycle-upcoming-review.yml
          git add apps/api/src/routes/events.ts apps/api/src/__tests__/events-lifecycle.test.ts
          git commit -m "fix(events): exclude awaiting results from upcoming list"
          git push origin HEAD:perf/competition-search-cte
