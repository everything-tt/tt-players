# Netlify configuration for TT Players.
#
# GitHub Actions deploys apps/mobile/dist directly. Keep routing/header changes
# mirrored in apps/mobile/public/_redirects so they are copied into the published
# artifact.

[build]
  command = "echo 'Build handled by GitHub Actions'"
  publish = "apps/mobile/dist"

[functions]
  directory = "netlify/functions"

# Proxy /api/* to the backend API on the tt-domain VPS (Cloudflare Tunnel).
# Keep this even when direct CORS is available: the frontend uses same-origin
# fetch('/api/...') so auth cookies and caching behave correctly.
[[redirects]]
  from = "/api/*"
  to = "https://ttp-api.tourneypilot.com/api/:splat"
  status = 200
  force = true

# Only the canonical public player profile is SSR. Deeper player routes and all
# /tabs/* routes continue through the SPA fallback below.
[[redirects]]
  from = "/players/:playerId"
  to = "/.netlify/functions/player-ssr?playerId=:playerId"
  status = 200
  force = true

# SPA fallback for all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable caching for hashed assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must not be cached.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"