name: Generate Match Record Migration

on:
  push:
    branches:
      - feat/refine-player-match-row-actions
    paths:
      - 'scripts/generate-match-record-migration.mjs'
      - '.github/workflows/generate-match-record-migration.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate transformed files
        run: node scripts/generate-match-record-migration.mjs

      - name: Upload transformed files
        uses: actions/upload-artifact@v4
        with:
          name: match-record-migration-${{ github.sha }}
          retention-days: 1
          path: generated-match-record-migration/
