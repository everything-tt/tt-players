name: Resolve PR 89 conflicts

on:
  push:
    branches:
      - design/player-insights-report
    paths:
      - .github/workflows/pr89-resolve-conflicts.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: design/player-insights-report

      - name: Merge current main and resolve the reviewed overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$conflicts" && "$conflicts" != "playwright.ui-review.config.ts" ]]; then
            echo "Unexpected conflict files:"
            echo "$conflicts"
            exit 1
          fi

          if [[ "$conflicts" == "playwright.ui-review.config.ts" ]]; then
            git checkout --ours playwright.ui-review.config.ts
            git add playwright.ui-review.config.ts
          elif [[ $merge_status -ne 0 ]]; then
            echo "Merge failed without a reported conflict"
            exit 1
          fi

          git rm .github/workflows/pr89-resolve-conflicts.yml
          git add -A
          git commit -m "Merge main and resolve Player Insights UI review conflict"
          git push origin HEAD:design/player-insights-report
