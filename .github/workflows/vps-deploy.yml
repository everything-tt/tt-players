name: Deploy API and Database to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/benchmark-api.mjs'
      - 'scripts/capture-query-plans.mjs'
      - 'scripts/__tests__/**'
      - 'scripts/lib/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/backup-vps-postgres.sh'
      - 'scripts/verify-vps-postgres-backup.sh'
      - 'scripts/analytics/**'
      - 'scripts/run-bigquery-sync.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'docs/bigquery-sync.md'
      - 'packages/db/**'
      - 'packages/ranking/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
  workflow_dispatch:

concurrency:
  group: vps-production-ttp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64, tt-players-ci]
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      CI_POSTGRES_HOST: ci-postgres-18
      DATABASE_URL: postgres://postgres:postgres@ci-postgres-18:5432/postgres?sslmode=disable
      TEST_DATABASE_BASE_URL: postgres://postgres:postgres@ci-postgres-18:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Wait for CI PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if pg_isready -h "$CI_POSTGRES_HOST" -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL at $CI_POSTGRES_HOST did not become ready" >&2
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        run: pnpm run check:backend

      - name: Validate deployment scripts and backup units
        run: |
          bash -n scripts/lib/service-recovery.sh
          bash -n scripts/backup-vps-postgres.sh
          bash -n scripts/verify-vps-postgres-backup.sh
          bash -n scripts/run-bigquery-sync.sh
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
          node --check scripts/analytics/table-manifest.mjs
          node --check scripts/analytics/bigquery-sql.mjs
          node --check scripts/analytics/commands.mjs
          node --check scripts/analytics/sync-bigquery.mjs
          systemd-analyze verify \
            infra/systemd/ttp-db-backup.service \
            infra/systemd/ttp-db-backup.timer

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: wudong-agent-master
          workload_identity_provider: ${{ vars.TT_PLAYERS_RUNTIME_CONFIG_WIF_PROVIDER }}
          service_account: ${{ vars.TT_PLAYERS_RUNTIME_SERVICE_ACCOUNT }}

      - name: Load runtime deployment credentials
        id: gcp-secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            vps_ssh_key:wudong-agent-master/tt-players-hetzner-vps-deploy-key
            cloudflare_account_id:wudong-agent-master/cloudflare-account-id
            cloudflare_ai_api_token:wudong-agent-master/cloudflare-ai-api-token
            ollama_api_key:wudong-agent-master/ollama-api-key

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_HOST_KEY: ${{ vars.TT_PLAYERS_VPS_HOST_KEY }}
          VPS_SSH_KEY: ${{ steps.gcp-secrets.outputs.vps_ssh_key }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure API authentication
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-api-env-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > "$local_patch"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/api.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^SUPABASE_(URL|PUBLISHABLE_KEY)=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Configure worker embedding credentials
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.gcp-secrets.outputs.cloudflare_account_id }}
          CLOUDFLARE_AI_API_TOKEN: ${{ steps.gcp-secrets.outputs.cloudflare_ai_api_token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-worker-cloudflare-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_AI_API_TOKEN" > "$local_patch"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^CLOUDFLARE_(API_TOKEN|ACCOUNT_ID)=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Configure Ollama form analysis
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          OLLAMA_API_KEY: ${{ steps.gcp-secrets.outputs.ollama_api_key }}
        run: |
          set -euo pipefail
          test -n "$OLLAMA_API_KEY"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-worker-ollama-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'OLLAMA_API_KEY=%s\n' "$OLLAMA_API_KEY" > "$local_patch"
          printf 'ENTRY_FORM_LLM_BASE_URL=https://api.ollama.com\n' >> "$local_patch"
          printf 'ENTRY_FORM_LLM_MODEL=deepseek-v4-flash:0731\n' >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^(OLLAMA_API_KEY|DEEPSEEK_API_KEY|ENTRY_FORM_LLM_(BASE_URL|MODEL|API_KEY))=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Determine database compatibility boundary
        id: database
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
        run: |
          set -euo pipefail

          current_sha=$(ssh "$VPS_USER@$VPS_HOST" \
            "sed -n 's/^commit_sha=//p' /opt/tt-players/current/.release-metadata 2>/dev/null | head -n 1" || true)

          database_changed=true
          if [[ -n "$current_sha" ]] && git cat-file -e "$current_sha^{commit}" 2>/dev/null; then
            if git diff --quiet "$current_sha" "$GITHUB_SHA" -- \
              packages/db \
              scripts/migrate-vps-postgres.sh \
              infra/postgres; then
              database_changed=false
            fi
          fi

          db_fingerprint=$(git ls-tree -r "$GITHUB_SHA" -- \
            packages/db \
            scripts/migrate-vps-postgres.sh \
            infra/postgres | sha256sum | awk '{print $1}')

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"
          echo "db_fingerprint=$db_fingerprint" >> "$GITHUB_OUTPUT"

          if [[ "$database_changed" == true ]]; then
            echo "::warning::Database files changed. This deployment creates a forward-only boundary and cannot be rolled back."
          else
            echo "Database fingerprint is unchanged; a manual rollback to a compatible deployed release will remain available."
          fi

      - name: Upload versioned release
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "mkdir -p /opt/tt-players/releases/$RELEASE_SHA"

          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude test-results \
            --exclude .env \
            --exclude docker-compose.yml \
            --exclude backups \
            --exclude .playwright-cli \
            --exclude 'gha-creds-*.json' \
            --exclude '*.dump' \
            ./ "$VPS_USER@$VPS_HOST:/opt/tt-players/releases/$RELEASE_SHA/"

      - name: Activate release
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          RELEASE_SHA: ${{ github.sha }}
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/tt-players/releases/$RELEASE_SHA/scripts/deploy-vps-release.sh \
              /opt/tt-players/releases/$RELEASE_SHA \
              '$RELEASE_SHA' \
              '$DB_FINGERPRINT' \
              '$DATABASE_CHANGED'"

      - name: Verify production health
        run: |
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health/db

      - name: Deployment summary
        env:
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          {
            echo "### VPS release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Database changed: \`$DATABASE_CHANGED\`"
            echo "- Database fingerprint: \`$DB_FINGERPRINT\`"
            echo "- Cloudflare worker credentials: configured from \`CLOUDFLARE_ACCOUNT_ID\` and \`CLOUDFLARE_AI_API_TOKEN\`"
            echo "- Ollama form analysis: configured from \`OLLAMA_API_KEY\` using \`deepseek-v4-flash:0731\`"
            if [[ "$DATABASE_CHANGED" == true ]]; then
              echo "- Rollback: **disabled**; recovery is forward-only"
            else
              echo "- Rollback: available through the manual VPS rollback workflow for compatible releases"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary SSH patches and Google credentials
        if: always()
        env:
          VPS_HOST: ${{ vars.TT_PLAYERS_VPS_HOST }}
          VPS_USER: ${{ vars.TT_PLAYERS_VPS_USER }}
          REMOTE_PATCHES: >-
            /tmp/ttp-api-env-${{ github.run_id }}
            /tmp/ttp-worker-cloudflare-${{ github.run_id }}
            /tmp/ttp-worker-ollama-${{ github.run_id }}
        run: |
          if [[ -n "${VPS_HOST:-}" && -n "${VPS_USER:-}" ]]; then
            ssh "$VPS_USER@$VPS_HOST" "rm -f $REMOTE_PATCHES" || true
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
