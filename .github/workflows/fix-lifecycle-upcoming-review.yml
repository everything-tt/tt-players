name: Fix lifecycle upcoming review finding

on:
  push:
    branches:
      - perf/competition-search-cte
    paths:
      - '.github/workflows/fix-lifecycle-upcoming-review.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

