name: Main UI Audit

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS deployment URL to audit
        required: true
        default: https://ttp.tourneypilot.com
        type: string

permissions:
  contents: read

concurrency:
  group: main-ui-audit-manual
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, docker-ui-screenshot, playwright]
    timeout-minutes: 90
    env:
      PREVIEW_URL: ${{ inputs.target_url }}
      UI_REVIEW_REPORT_DIR: ${{ github.workspace }}/ui-review-report
      UI_AUDIT_MAX_DISCOVERED_ROUTES: 36
      UI_AUDIT_MAX_INTERACTIONS_PER_ROUTE: 4
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      UI_AUDIT_EMAIL: ${{ secrets.UI_AUDIT_EMAIL }}
      UI_AUDIT_PASSWORD: ${{ secrets.UI_AUDIT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tt-players/mobile exec playwright install chromium

      - name: Wait for target deployment
        run: |
          set -euo pipefail
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Target URL must use HTTPS: $PREVIEW_URL" >&2; exit 64 ;;
          esac
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$PREVIEW_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Target deployment did not become ready: $PREVIEW_URL" >&2
          exit 1

      - name: Record host resources before
        run: |
          rm -rf ui-review-report test-results/main-audit
          mkdir -p ui-review-report/diagnostics test-results/main-audit
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            hostname
            uname -a
            free -h
            df -h
          } > ui-review-report/diagnostics/host-before.txt

      - name: Collect main UI screenshots
        run: pnpm --filter @tt-players/mobile exec playwright test --config=../../playwright.main-audit.config.ts

      - name: Record host resources after
        if: always()
        run: |
          mkdir -p ui-review-report/diagnostics
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            free -h
            df -h
            ps --sort=-rss -eo pid,ppid,rss,comm,args | head -40 || true
          } > ui-review-report/diagnostics/host-after.txt

      - name: Upload main UI audit artifact
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ui-review-report/
            test-results/main-audit/

      - name: Deploy main UI audit report to Netlify
        if: always() && hashFiles('ui-review-report/index.html') != ''
        id: report
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_ALIAS: main-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEPLOY_DIR"' EXIT
          cp -a ui-review-report/. "$DEPLOY_DIR/"
          cd "$DEPLOY_DIR"

          pnpm --package=netlify-cli@27.0.1 dlx netlify deploy \
            --dir=. \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --alias="$NETLIFY_ALIAS" \
            --message="Main UI audit ${{ github.run_id }}.${{ github.run_attempt }} for ${{ inputs.target_url }} (${{ github.sha }})" \
            --no-build \
            --json > netlify-deploy.json

          REPORT_URL="$(node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("netlify-deploy.json", "utf8"));
            const url = result.deploy_url || result.deployUrl || result.url;
            if (!url) throw new Error("Netlify CLI did not return a deploy URL");
            process.stdout.write(url.replace(/\/$/, ""));
          ')"

          case "$REPORT_URL" in
            "https://$NETLIFY_ALIAS--"*.netlify.app) ;;
            *)
              echo "Expected an aliased draft deploy, received: $REPORT_URL" >&2
              exit 1
              ;;
          esac

          if [ "$REPORT_URL" = "https://ttp.tourneypilot.com" ] || \
             [ "$REPORT_URL" = "https://ttp-players.netlify.app" ]; then
            echo "Refusing to use the production frontend URL for an audit report" >&2
            exit 1
          fi

          curl -fsS --max-time 30 "$REPORT_URL" >/dev/null
          echo "deploy-url=$REPORT_URL" >> "$GITHUB_OUTPUT"

      - name: Add main UI audit summary
        if: always()
        env:
          ARTIFACT_NAME: main-ui-audit-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.deploy-url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          let items = [];
          try {
            items = JSON.parse(fs.readFileSync('ui-review-report/manifest.json', 'utf8'));
          } catch {}

          const count = (status) => items.filter((item) => item.status === status).length;
          const captured = count('captured');
          const skipped = count('skipped');
          const errors = count('error');
          const diagnosticEvents = items.reduce(
            (total, item) => total + (Number(item.eventCount) || 0),
            0,
          );

          const reportUrl = process.env.REPORT_URL?.trim();
          const artifactUrl = process.env.ARTIFACT_URL?.trim();
          const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
          const runUrl = `${repositoryUrl}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const commitUrl = `${repositoryUrl}/commit/${process.env.GITHUB_SHA}`;
          const shortSha = (process.env.GITHUB_SHA || '').slice(0, 7);
          const result = process.env.JOB_STATUS || 'unknown';
          const resultIcon = result === 'success' ? '✅' : result === 'cancelled' ? '⚪' : '❌';

          const lines = [
            `## ${resultIcon} Main UI audit`,
            '',
            '| Item | Result |',
            '| --- | --- |',
            `| Job status | **${result}** |`,
            '| Mode | Screenshot collection |',
            `| Target | [${process.env.PREVIEW_URL}](${process.env.PREVIEW_URL}) |`,
            `| Commit | [\`${shortSha}\`](${commitUrl}) |`,
            `| Captured screens | **${captured}** |`,
            `| Skipped screens | ${skipped} |`,
            `| Capture errors | **${errors}** |`,
            `| Diagnostic events | ${diagnosticEvents} |`,
            '',
            '### Reports',
            '',
            reportUrl
              ? `- [Open the interactive Netlify UI audit report](${reportUrl})`
              : '- Interactive Netlify report unavailable.',
            artifactUrl
              ? `- [Download the complete GitHub artifact](${artifactUrl})`
              : `- GitHub artifact: \`${process.env.ARTIFACT_NAME}\``,
            `- [Open this workflow run](${runUrl})`,
            '',
          ];

          if (errors > 0) {
            lines.push('> [!WARNING]');
            lines.push(`> The audit recorded ${errors} screenshot capture error${errors === 1 ? '' : 's'}.`);
            lines.push('');
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          NODE
