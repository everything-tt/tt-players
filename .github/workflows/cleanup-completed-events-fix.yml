name: Clean up completed event fix

on:
  push:
    branches:
      - fix/completed-events-avoid-exact-count
    paths:
      - '.github/workflows/cleanup-completed-events-fix.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/completed-events-avoid-exact-count
          fetch-depth: 0

      - name: Format changed blocks
        run: |
          python <<'PY'
          from pathlib import Path

          route_path = Path('apps/api/src/routes/events.ts')
          lines = route_path.read_text().splitlines()
          start = lines.index('                const page = query.include_total')
          end = start
          while lines[end] != '        }':
              end += 1
          route_block = [
              '                const page = query.include_total',
              '                    ? await fetchExactEventPage(db, query)',
              '                    : await fetchFastEventPage(db, query);',
              '                const { pageIds, total, hasMore } = page;',
              '',
              '                if (pageIds.length === 0) {',
              '                    return {',
              '                        data: [],',
              '                        total,',
              '                        limit: query.limit,',
              '                        offset: query.offset,',
              '                        has_more: hasMore,',
              '                    };',
              '                }',
          ]
          lines[start:end + 1] = route_block
          route_path.write_text('\n'.join(lines) + '\n')

          hook_path = Path('apps/mobile/src/hooks/useTournamentList.ts')
          lines = hook_path.read_text().splitlines()
          start = lines.index('  useEffect(() => {')
          end = lines.index('}, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);', start)
          reset_block = [
              '  useEffect(() => {',
              '    setOffset(0);',
              '    setItems([]);',
              '    setTotal(0);',
              '    setHasMore(false);',
              '  }, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);',
          ]
          lines[start:end + 1] = reset_block

          start = lines.index('  useEffect(() => {', start + len(reset_block))
          end = lines.index('}, [offset, query.data]);', start)
          response_block = [
              '  useEffect(() => {',
              '    if (!query.data) return;',
              '    const page = normalizePagedResponse(query.data, offset);',
              '    setHasMore(page.hasMore);',
              '    setTotal(page.total ?? offset + page.data.length + (page.hasMore ? 1 : 0));',
              '    setItems((previous) => mergePageById(previous, page.data, offset === 0));',
              '  }, [offset, query.data]);',
          ]
          lines[start:end + 1] = response_block
          hook_path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Commit cleanup
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-completed-events-fix.yml
          rm -f .github/workflows/format-completed-events-fix.yml
          rm -f .github/workflows/cleanup-completed-events-fix.yml
          git config user.name 'Wudong Liu'
          git config user.email 'wudong.liu@gmail.com'
          git add apps/api apps/mobile .github/workflows
          git commit -m 'style: format completed event pagination changes'
          git push origin HEAD:fix/completed-events-avoid-exact-count
