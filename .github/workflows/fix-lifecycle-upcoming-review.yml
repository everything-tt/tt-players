name: Fix lifecycle upcoming review finding

on:
  push:
    branches:
      - perf/competition-search-cte
    paths:
      - '.github/workflows/fix-lifecycle-upcoming-review.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/competition-search-cte
          fetch-depth: 0

      - name: Apply review fix
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/fix-lifecycle.py
          python /tmp/fix-lifecycle.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          pnpm --filter @tt-players/api test -- events-lifecycle.test.ts events-pagination-query-shape.test.ts
          pnpm run check:backend

      - name: Commit review fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-lifecycle-upcoming-review.yml
          git add apps/api/src/routes/events.ts apps/api/src/__tests__/events-lifecycle.test.ts
          git commit -m "fix(events): exclude awaiting results from upcoming list"
          git push origin HEAD:perf/competition-search-cte
