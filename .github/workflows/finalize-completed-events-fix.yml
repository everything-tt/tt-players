name: Finalize completed event performance fix

on:
  push:
    branches:
      - fix/completed-events-avoid-exact-count
    paths:
      - '.github/workflows/finalize-completed-events-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/completed-events-avoid-exact-count
          fetch-depth: 0

      - name: Format changed blocks
        run: |
          python <<'PY'
          from pathlib import Path

          route_path = Path('apps/api/src/routes/events.ts')
          route = route_path.read_text()
          before = '''                const page = query.include_total
            ? await fetchExactEventPage(db, query)
            : await fetchFastEventPage(db, query);
        const { pageIds, total, hasMore } = page;

        if (pageIds.length === 0) {
            return {
                data: [],
                total,
                limit: query.limit,
                offset: query.offset,
                has_more: hasMore,
            };
        }
'''
          after = '''                const page = query.include_total
                    ? await fetchExactEventPage(db, query)
                    : await fetchFastEventPage(db, query);
                const { pageIds, total, hasMore } = page;

                if (pageIds.length === 0) {
                    return {
                        data: [],
                        total,
                        limit: query.limit,
                        offset: query.offset,
                        has_more: hasMore,
                    };
                }
'''
          if route.count(before) != 1:
              raise SystemExit(f'Expected one route formatting block, found {route.count(before)}')
          route_path.write_text(route.replace(before, after))

          hook_path = Path('apps/mobile/src/hooks/useTournamentList.ts')
          hook = hook_path.read_text()
          before = '''  useEffect(() => {
    setOffset(0);
    setItems([]);
    setTotal(0);
  setHasMore(false);
}, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);
'''
          after = '''  useEffect(() => {
    setOffset(0);
    setItems([]);
    setTotal(0);
    setHasMore(false);
  }, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);
'''
          if hook.count(before) != 1:
              raise SystemExit(f'Expected one hook reset block, found {hook.count(before)}')
          hook = hook.replace(before, after)

          before = '''  useEffect(() => {
  if (!query.data) return;
  const page = normalizePagedResponse(query.data, offset);
  setHasMore(page.hasMore);
  setTotal(page.total ?? offset + page.data.length + (page.hasMore ? 1 : 0));
  setItems((previous) => mergePageById(previous, page.data, offset === 0));
}, [offset, query.data]);
'''
          after = '''  useEffect(() => {
    if (!query.data) return;
    const page = normalizePagedResponse(query.data, offset);
    setHasMore(page.hasMore);
    setTotal(page.total ?? offset + page.data.length + (page.hasMore ? 1 : 0));
    setItems((previous) => mergePageById(previous, page.data, offset === 0));
  }, [offset, query.data]);
'''
          if hook.count(before) != 1:
              raise SystemExit(f'Expected one hook response block, found {hook.count(before)}')
          hook_path.write_text(hook.replace(before, after))
          PY

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Benchmark bounded production query
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sql_file=$(mktemp --suffix=.sql)
          cat > "$sql_file" <<'SQL'
          EXPLAIN (ANALYZE, BUFFERS, SETTINGS)
          WITH candidates AS MATERIALIZED (
              SELECT
                  c.id,
                  row_number() OVER (
                      ORDER BY
                          coalesce(c.start_date, c.event_date) DESC,
                          coalesce(c.display_name, c.name) ASC,
                          c.id ASC
                  ) AS ordinal
              FROM competitions c
              WHERE c.type = 'individual'
                AND c.deleted_at IS NULL
                AND c.event_status = 'completed'
              ORDER BY
                  coalesce(c.start_date, c.event_date) DESC,
                  coalesce(c.display_name, c.name) ASC,
                  c.id ASC
              LIMIT 100
          ), eligible AS MATERIALIZED (
              SELECT DISTINCT f.competition_id
              FROM fixtures f
              JOIN rubbers r ON r.fixture_id = f.id
              WHERE f.competition_id IN (SELECT id FROM candidates)
                AND f.deleted_at IS NULL
                AND r.deleted_at IS NULL
                AND r.is_doubles = false
          )
          SELECT candidate.id
          FROM candidates candidate
          JOIN eligible ON eligible.competition_id = candidate.id
          ORDER BY candidate.ordinal
          LIMIT 11;
          SQL
          chown ttp:ttp "$sql_file"
          chmod 600 "$sql_file"
          systemd-run \
            --quiet \
            --wait \
            --pipe \
            --collect \
            --unit=ttp-completed-event-bounded-benchmark \
            --uid=ttp \
            --gid=ttp \
            --property=EnvironmentFile=/etc/ttp/api.env \
            /bin/bash -lc '/usr/bin/psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$1"' bash "$sql_file"
          rm -f "$sql_file"
          REMOTE

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Mobile tests
        run: pnpm --filter @tt-players/mobile test

      - name: Commit formatting and cleanup
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-completed-events-fix.yml
          git config user.name 'Wudong Liu'
          git config user.email 'wudong.liu@gmail.com'
          git add apps/api apps/mobile .github/workflows
          git commit -m 'style: format completed event pagination changes'
          git push origin HEAD:fix/completed-events-avoid-exact-count
