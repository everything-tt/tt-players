name: PR Main UI Migration Audit

on:
  push:
    branches:
      - feat/shadcn-design-system-migration
    paths:
      - '.github/workflows/pr-main-ui-audit.yml'

permissions:
  contents: read

concurrency:
  group: pr-main-ui-migration-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64, docker-ui-screenshot, playwright]
    timeout-minutes: 90
    env:
      PREVIEW_URL: https://6a746a104fbe20c3e38205ff--ttp-players.netlify.app
      UI_REVIEW_REPORT_DIR: ${{ github.workspace }}/ui-review-report
      UI_AUDIT_MAX_DISCOVERED_ROUTES: 36
      UI_AUDIT_MAX_INTERACTIONS_PER_ROUTE: 4
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      UI_AUDIT_EMAIL: ${{ secrets.UI_AUDIT_EMAIL }}
      UI_AUDIT_PASSWORD: ${{ secrets.UI_AUDIT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tt-players/mobile exec playwright install chromium

      - name: Wait for audited deployment
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$PREVIEW_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Collect full UI audit
        run: pnpm --filter @tt-players/mobile exec playwright test --config=../../playwright.main-audit.config.ts

      - name: Upload full UI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadcn-full-ui-audit-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ui-review-report/
            test-results/main-audit/
