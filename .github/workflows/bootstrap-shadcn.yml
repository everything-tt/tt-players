name: Bootstrap shadcn migration

on:
  push:
    branches:
      - feat/shadcn-design-system-migration
    paths:
      - '.github/workflows/bootstrap-shadcn.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply migration and update lockfile
        shell: bash
        run: |
          set -euo pipefail
          cat .github/migration/shadcn.part.* | base64 --decode | gzip --decompress > /tmp/shadcn-migration.patch
          git apply --check /tmp/shadcn-migration.patch
          git apply /tmp/shadcn-migration.patch
          pnpm install --lockfile-only --no-frozen-lockfile
          rm -rf .github/migration
          rm .github/workflows/bootstrap-shadcn.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate design system to shadcn"
          git push origin HEAD:feat/shadcn-design-system-migration
