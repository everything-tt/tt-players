name: Apply completed event pagination fix v2

on:
  push:
    branches:
      - fix/completed-events-avoid-exact-count
    paths:
      - '.github/workflows/apply-completed-events-fix-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/completed-events-avoid-exact-count
          fetch-depth: 0

      - name: Repair and run source transformation
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/completed-events-diagnostic.yml')
          content = workflow.read_text()
          replacement = r'''route = replaceOnce(route, `                return {
                              data: events.map((event) => mapEvent(event)),
                              total,
                              limit: query.limit,
                              offset: query.offset,
                          };`, `                return {
                              data: events.map((event) => mapEvent(event)),
                              total,
                              limit: query.limit,
                              offset: query.offset,
                              has_more: hasMore,
                          };`, 'list response has_more');'''
          content, count = re.subn(
              r"route = replaceOnce\(route, `                    offset: query\.offset,[\s\S]*?'list response has_more'\);",
              replacement,
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one pagination response patch, found {count}')

          marker = "          node <<'NODE'\n"
          start = content.index(marker) + len(marker)
          end = content.index("\n          NODE", start)
          script = textwrap.dedent(content[start:end])
          Path('/tmp/apply-completed-events-fix.js').write_text(script)
          PY
          node /tmp/apply-completed-events-fix.js
          rm .github/workflows/apply-completed-events-fix-v2.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Mobile tests
        run: pnpm --filter @tt-players/mobile test

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Wudong Liu'
          git config user.email 'wudong.liu@gmail.com'
          git add apps/api apps/mobile .github/workflows
          git commit -m 'fix(api): bound completed event eligibility scans'
          git push origin HEAD:fix/completed-events-avoid-exact-count
