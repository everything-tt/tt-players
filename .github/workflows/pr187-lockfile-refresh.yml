name: PR 187 lockfile refresh

on:
  push:
    branches:
      - agent/entry-form-parsing
    paths:
      - '.github/workflows/pr187-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/entry-form-parsing
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit refreshed lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git rm .github/workflows/pr187-lockfile-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: reconcile lockfile after main merge'
          git push origin HEAD:agent/entry-form-parsing
