name: Backend CI

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/benchmark-api.mjs'
      - 'scripts/capture-query-plans.mjs'
      - 'scripts/__tests__/**'
      - 'scripts/lib/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/backup-vps-postgres.sh'
      - 'scripts/verify-vps-postgres-backup.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'packages/db/**'
      - 'packages/ranking/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/parameter-manager-shadow.yml'
      - '.github/workflows/rating-backtest.yml'
      - '.github/workflows/rating-rebuild.yml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
      - '.github/workflows/tte-calendar-sync.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/benchmark-api.mjs'
      - 'scripts/capture-query-plans.mjs'
      - 'scripts/__tests__/**'
      - 'scripts/lib/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/backup-vps-postgres.sh'
      - 'scripts/verify-vps-postgres-backup.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'packages/db/**'
      - 'packages/ranking/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/parameter-manager-shadow.yml'
      - '.github/workflows/rating-backtest.yml'
      - '.github/workflows/rating-rebuild.yml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
      - '.github/workflows/tte-calendar-sync.yml'

permissions:
  contents: read
  packages: read

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 15

    env:
      CI_POSTGRES_HOST: ci-postgres-18
      DATABASE_URL: postgres://postgres:postgres@ci-postgres-18:5432/postgres?sslmode=disable
      TEST_DATABASE_BASE_URL: postgres://postgres:postgres@ci-postgres-18:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for CI PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if pg_isready -h "$CI_POSTGRES_HOST" -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL at $CI_POSTGRES_HOST did not become ready" >&2
          exit 1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Validate VPS scripts and backup units
        run: |
          bash -n scripts/lib/service-recovery.sh
          bash -n scripts/backup-vps-postgres.sh
          bash -n scripts/verify-vps-postgres-backup.sh
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
          systemd-analyze verify \
            infra/systemd/ttp-db-backup.service \
            infra/systemd/ttp-db-backup.timer

  validate-self-hosted:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, ARM64, everything-tt]
    timeout-minutes: 15
    env:
      CI_POSTGRES_HOST: ci-postgres-18
      DATABASE_URL: postgres://postgres:postgres@ci-postgres-18:5432/postgres?sslmode=disable
      TEST_DATABASE_BASE_URL: postgres://postgres:postgres@ci-postgres-18:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Wait for CI PostgreSQL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if pg_isready -h "$CI_POSTGRES_HOST" -U postgres -d postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL at $CI_POSTGRES_HOST did not become ready" >&2
          exit 1

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        run: pnpm run check:backend

      - name: Validate VPS scripts and backup units
        run: |
          bash -n scripts/lib/service-recovery.sh
          bash -n scripts/backup-vps-postgres.sh
          bash -n scripts/verify-vps-postgres-backup.sh
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
          systemd-analyze verify \
            infra/systemd/ttp-db-backup.service \
            infra/systemd/ttp-db-backup.timer
