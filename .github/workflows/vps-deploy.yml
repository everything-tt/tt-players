name: Deploy API and Database to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/benchmark-api.mjs'
      - 'scripts/capture-query-plans.mjs'
      - 'scripts/__tests__/**'
      - 'scripts/lib/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/backup-vps-postgres.sh'
      - 'scripts/verify-vps-postgres-backup.sh'
      - 'scripts/analytics/**'
      - 'scripts/run-bigquery-sync.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'docs/bigquery-sync.md'
      - 'packages/db/**'
      - 'packages/ranking/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
  workflow_dispatch:

concurrency:
  group: vps-production-ttp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: wudong-agent-master
      TT_PLAYERS_RUNTIME_WIF_PROVIDER: projects/126174378735/locations/global/workloadIdentityPools/tt-players-actions/providers/runtime-config
      TT_PLAYERS_RUNTIME_SERVICE_ACCOUNT: tt-players-runtime-reader@wudong-agent-master.iam.gserviceaccount.com
      TT_PLAYERS_RUNTIME_PARAMETER: tt-players-runtime-prod

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Validate deployment scripts and backup units
        run: |
          bash -n scripts/lib/service-recovery.sh
          bash -n scripts/backup-vps-postgres.sh
          bash -n scripts/verify-vps-postgres-backup.sh
          bash -n scripts/run-bigquery-sync.sh
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
          node --check scripts/analytics/table-manifest.mjs
          node --check scripts/analytics/bigquery-sql.mjs
          node --check scripts/analytics/commands.mjs
          node --check scripts/analytics/sync-bigquery.mjs
          systemd-analyze verify \
            infra/systemd/ttp-db-backup.service \
            infra/systemd/ttp-db-backup.timer

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.TT_PLAYERS_RUNTIME_WIF_PROVIDER }}
          service_account: ${{ env.TT_PLAYERS_RUNTIME_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Render runtime deployment configuration
        run: |
          set -euo pipefail
          umask 077
          CONFIG_FILE="$(mktemp)"
          SSH_KEY_FILE="$(mktemp)"
          chmod 600 "$CONFIG_FILE" "$SSH_KEY_FILE"
          printf 'CONFIG_FILE=%s\n' "$CONFIG_FILE" >> "$GITHUB_ENV"
          printf 'SSH_KEY_FILE=%s\n' "$SSH_KEY_FILE" >> "$GITHUB_ENV"

          gcloud parametermanager parameters versions render latest \
            --project="$GCP_PROJECT_ID" \
            --parameter="$TT_PLAYERS_RUNTIME_PARAMETER" \
            --location=global \
            --format="value(renderedPayload)" \
            | base64 -d > "$CONFIG_FILE"

          jq -e '
            type == "object" and
            .schema_version == 1 and
            (.vps.host | type == "string" and length > 0) and
            (.vps.user | type == "string" and length > 0) and
            (.vps.host_key | type == "string" and length > 0) and
            (.api.supabase_url | type == "string" and length > 0) and
            (.api.supabase_publishable_key | type == "string" and length > 0) and
            (.entry_form_llm.base_url | type == "string" and length > 0) and
            (.entry_form_llm.model | type == "string" and length > 0) and
            (.secrets.cloudflare_account_id | type == "string" and length > 0) and
            (.secrets.cloudflare_ai_api_token | type == "string" and length > 0) and
            (.secrets.ollama_api_key | type == "string" and length > 0) and
            (.secrets.vps_ssh_key_secret_id | type == "string" and length > 0)
          ' "$CONFIG_FILE" >/dev/null

          rendered_ssh_secret_id="$(jq -er '.secrets.vps_ssh_key_secret_id' "$CONFIG_FILE")"
          gcloud secrets versions access latest \
            --project="$GCP_PROJECT_ID" \
            --secret="$rendered_ssh_secret_id" > "$SSH_KEY_FILE"
          test -s "$SSH_KEY_FILE"
          grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' "$SSH_KEY_FILE"

      - name: Configure SSH
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_HOST_KEY="$(jq -er '.vps.host_key' "$CONFIG_FILE")"
          test -n "$VPS_HOST"
          test -n "$VPS_HOST_KEY"
          test -s "$SSH_KEY_FILE"
          install -m 700 -d ~/.ssh
          install -m 600 "$SSH_KEY_FILE" ~/.ssh/id_ed25519
          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure API authentication
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"
          SUPABASE_URL="$(jq -er '.api.supabase_url' "$CONFIG_FILE")"
          SUPABASE_PUBLISHABLE_KEY="$(jq -er '.api.supabase_publishable_key' "$CONFIG_FILE")"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-api-env-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" > "$local_patch"
          printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY" >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/api.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^SUPABASE_(URL|PUBLISHABLE_KEY)=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Configure worker embedding credentials
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"
          CLOUDFLARE_ACCOUNT_ID="$(jq -er '.secrets.cloudflare_account_id' "$CONFIG_FILE")"
          CLOUDFLARE_AI_API_TOKEN="$(jq -er '.secrets.cloudflare_ai_api_token' "$CONFIG_FILE")"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_AI_API_TOKEN"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-worker-cloudflare-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_AI_API_TOKEN" > "$local_patch"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID" >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^CLOUDFLARE_(API_TOKEN|ACCOUNT_ID)=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Configure Ollama form analysis
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"
          OLLAMA_API_KEY="$(jq -er '.secrets.ollama_api_key' "$CONFIG_FILE")"
          ENTRY_FORM_LLM_BASE_URL="$(jq -er '.entry_form_llm.base_url' "$CONFIG_FILE")"
          ENTRY_FORM_LLM_MODEL="$(jq -er '.entry_form_llm.model' "$CONFIG_FILE")"
          test -n "$OLLAMA_API_KEY"
          test -n "$ENTRY_FORM_LLM_BASE_URL"
          test -n "$ENTRY_FORM_LLM_MODEL"
          umask 077
          local_patch=$(mktemp)
          remote_patch="/tmp/ttp-worker-ollama-${GITHUB_RUN_ID}"
          trap 'rm -f "$local_patch"' EXIT
          printf 'OLLAMA_API_KEY=%s\n' "$OLLAMA_API_KEY" > "$local_patch"
          printf 'ENTRY_FORM_LLM_BASE_URL=%s\n' "$ENTRY_FORM_LLM_BASE_URL" >> "$local_patch"
          printf 'ENTRY_FORM_LLM_MODEL=%s\n' "$ENTRY_FORM_LLM_MODEL" >> "$local_patch"
          scp "$local_patch" "$VPS_USER@$VPS_HOST:$remote_patch"

          ssh "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATCH='$remote_patch' bash -s" <<'REMOTE'
          set -euo pipefail
          env_file=/etc/ttp/worker.env
          patch_file="$REMOTE_PATCH"
          temp_file=$(mktemp)
          trap 'rm -f "$temp_file" "$patch_file"' EXIT
          if [[ -f "$env_file" ]]; then
            grep -v -E '^(OLLAMA_API_KEY|DEEPSEEK_API_KEY|ENTRY_FORM_LLM_(BASE_URL|MODEL|API_KEY))=' "$env_file" > "$temp_file" || true
          fi
          cat "$patch_file" >> "$temp_file"
          install -m 600 "$temp_file" "$env_file"
          REMOTE

      - name: Determine database compatibility boundary
        id: database
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"

          current_sha=$(ssh "$VPS_USER@$VPS_HOST" \
            "sed -n 's/^commit_sha=//p' /opt/tt-players/current/.release-metadata 2>/dev/null | head -n 1" || true)

          database_changed=true
          if [[ -n "$current_sha" ]] && git cat-file -e "$current_sha^{commit}" 2>/dev/null; then
            if git diff --quiet "$current_sha" "$GITHUB_SHA" -- \
              packages/db \
              scripts/migrate-vps-postgres.sh \
              infra/postgres; then
              database_changed=false
            fi
          fi

          db_fingerprint=$(git ls-tree -r "$GITHUB_SHA" -- \
            packages/db \
            scripts/migrate-vps-postgres.sh \
            infra/postgres | sha256sum | awk '{print $1}')

          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "database_changed=$database_changed" >> "$GITHUB_OUTPUT"
          echo "db_fingerprint=$db_fingerprint" >> "$GITHUB_OUTPUT"

          if [[ "$database_changed" == true ]]; then
            echo "::warning::Database files changed. This deployment creates a forward-only boundary and cannot be rolled back."
          else
            echo "Database fingerprint is unchanged; a manual rollback to a compatible deployed release will remain available."
          fi

      - name: Upload versioned release
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"
          RELEASE_SHA="$GITHUB_SHA"

          ssh "$VPS_USER@$VPS_HOST" \
            "mkdir -p /opt/tt-players/releases/$RELEASE_SHA"

          rsync -az --delete \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude test-results \
            --exclude .env \
            --exclude docker-compose.yml \
            --exclude backups \
            --exclude .playwright-cli \
            --exclude 'gha-creds-*.json' \
            --exclude '*.dump' \
            ./ "$VPS_USER@$VPS_HOST:/opt/tt-players/releases/$RELEASE_SHA/"

      - name: Activate release
        env:
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          set -euo pipefail
          VPS_HOST="$(jq -er '.vps.host' "$CONFIG_FILE")"
          VPS_USER="$(jq -er '.vps.user' "$CONFIG_FILE")"
          RELEASE_SHA="$GITHUB_SHA"

          ssh "$VPS_USER@$VPS_HOST" \
            "bash /opt/tt-players/releases/$RELEASE_SHA/scripts/deploy-vps-release.sh \
              /opt/tt-players/releases/$RELEASE_SHA \
              '$RELEASE_SHA' \
              '$DB_FINGERPRINT' \
              '$DATABASE_CHANGED'"

      - name: Verify production health
        run: |
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health
          curl --fail --retry 10 --retry-delay 3 https://ttp-api.tourneypilot.com/api/health/db

      - name: Deployment summary
        env:
          DATABASE_CHANGED: ${{ steps.database.outputs.database_changed }}
          DB_FINGERPRINT: ${{ steps.database.outputs.db_fingerprint }}
        run: |
          set -euo pipefail
          ENTRY_FORM_LLM_MODEL="$(jq -er '.entry_form_llm.model' "$CONFIG_FILE")"
          {
            echo "### VPS release"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Database changed: \`$DATABASE_CHANGED\`"
            echo "- Database fingerprint: \`$DB_FINGERPRINT\`"
            echo "- Runtime config source: GCP Parameter Manager \`$TT_PLAYERS_RUNTIME_PARAMETER\`"
            echo "- Cloudflare worker credentials: configured from rendered Parameter Manager secret references"
            echo "- Ollama form analysis: configured from rendered Parameter Manager secret reference using \`$ENTRY_FORM_LLM_MODEL\`"
            if [[ "$DATABASE_CHANGED" == true ]]; then
              echo "- Rollback: **disabled**; recovery is forward-only"
            else
              echo "- Rollback: available through the manual VPS rollback workflow for compatible releases"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary SSH patches and Google credentials
        if: always()
        run: |
          VPS_HOST=""
          VPS_USER=""
          if [[ -n "${CONFIG_FILE:-}" && -f "$CONFIG_FILE" ]]; then
            VPS_HOST="$(jq -r '.vps.host // empty' "$CONFIG_FILE" 2>/dev/null || true)"
            VPS_USER="$(jq -r '.vps.user // empty' "$CONFIG_FILE" 2>/dev/null || true)"
          fi
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -f ~/.ssh/id_ed25519 ]]; then
            ssh "$VPS_USER@$VPS_HOST" \
              "rm -f /tmp/ttp-api-env-${GITHUB_RUN_ID} /tmp/ttp-worker-cloudflare-${GITHUB_RUN_ID} /tmp/ttp-worker-ollama-${GITHUB_RUN_ID}" || true
          fi
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          if [[ -n "${CONFIG_FILE:-}" ]]; then
            rm -f "$CONFIG_FILE"
          fi
          if [[ -n "${SSH_KEY_FILE:-}" ]]; then
            rm -f "$SSH_KEY_FILE"
          fi
          find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type f -name 'gha-creds-*.json' -delete 2>/dev/null || true
