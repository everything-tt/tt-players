name: Prepare Ranking Lockfile

on:
  push:
    branches:
      - refactor/ranking-package
    paths:
      - '.github/workflows/prepare-ranking-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ranking-package
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(ranking): update workspace lockfile'
          git push origin HEAD:refactor/ranking-package
