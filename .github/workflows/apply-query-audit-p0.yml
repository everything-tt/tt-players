name: Apply P0 query rewrites

on:
  push:
    branches:
      - perf/query-audit-p0

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/query-audit-p0
          fetch-depth: 0

      - name: Apply query rewrites
        run: python scripts/apply-query-audit-p0.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify focused guardrails
        run: pnpm --filter @tt-players/api exec vitest run src/__tests__/query-shape-guardrails.test.ts

      - name: Verify backend quality gate
        run: pnpm run check:backend

      - name: Commit implementation
        run: |
          rm scripts/apply-query-audit-p0.py
          rm .github/workflows/apply-query-audit-p0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/teams.ts \
                  apps/api/src/routes/leagues.ts \
                  apps/api/src/__tests__/query-shape-guardrails.test.ts \
                  scripts/apply-query-audit-p0.py \
                  .github/workflows/apply-query-audit-p0.yml
          git commit -m "perf(api): filter and bound broad aggregates"
          git push origin HEAD:perf/query-audit-p0
