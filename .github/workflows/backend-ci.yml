name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: write

jobs:
  apply_snapshot:
    if: github.head_ref == 'perf/league-snapshot-single-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: perf/league-snapshot-single-pass
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply query rewrite and correctness test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          route_path = Path('apps/api/src/routes/leagues.ts')
          route = route_path.read_text()
          pattern = re.compile(
              r"                    player_appearances AS MATERIALIZED \(.*?"
              r"                    total_players AS \(\n"
              r"                        SELECT COUNT\(DISTINCT player_id\)::int AS players\n"
              r"                        FROM player_appearances\n"
              r"                    \)",
              re.S,
          )
          replacement = base64.b64decode('').decode()
          route, count = pattern.subn(replacement, route, count=1)
          if count != 1:
              raise SystemExit(f'Expected one snapshot player block, replaced {count}')
          route = route.replace(
              '                    LEFT JOIN player_counts pc ON pc.competition_id = ac.id\n',
              '                    LEFT JOIN player_counts pc\n'
              '                      ON pc.competition_id = ac.id\n'
              '                     AND pc.grouping_level = 0\n',
              1,
          )
          route_path.write_text(route)

          test_content = base64.b64decode('').decode()
          Path('apps/api/src/__tests__/league-snapshot-player-counts.integration.test.ts').write_text(test_content)
          PY

      - name: Validate focused and full backend suites
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          pnpm --filter @tt-players/api exec vitest run \
            src/__tests__/query-shape-guardrails.test.ts \
            src/__tests__/league-snapshot-player-counts.integration.test.ts
          pnpm run check:backend

      - name: Commit validated implementation
        run: |
          git show origin/main:.github/workflows/backend-ci.yml > .github/workflows/backend-ci.yml
          rm .github/workflows/apply-league-snapshot-single-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/routes/leagues.ts \
            apps/api/src/__tests__/league-snapshot-player-counts.integration.test.ts \
            .github/workflows/backend-ci.yml \
            .github/workflows/apply-league-snapshot-single-pass.yml
          git commit -m "perf(api): compute league snapshot player counts in one pass"
          git push origin HEAD:perf/league-snapshot-single-pass
