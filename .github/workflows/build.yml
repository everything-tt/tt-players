name: Build and Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/design-system/**'
      - 'netlify.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'playwright.ui-review.config.ts'
      - 'playwright.main-audit.config.ts'
      - 'apps/mobile/tests/ui-review/**'
      - 'apps/mobile/tests/main-audit/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/design-system/**'
      - 'netlify.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'playwright.ui-review.config.ts'
      - 'playwright.main-audit.config.ts'
      - 'apps/mobile/tests/ui-review/**'
      - 'apps/mobile/tests/main-audit/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netlify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_url: ${{ steps.netlify.outputs.deploy-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @tt-players/mobile build

      - name: Deploy to Netlify
        id: netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./apps/mobile/dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.event.pull_request.title || github.event.head_commit.message }} (${{ github.sha }})"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  ui-screenshots:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build-deploy.outputs.deploy_url != ''
    needs: build-deploy
    runs-on: [self-hosted, Linux, ARM64, docker-ui-screenshot, playwright]
    timeout-minutes: 60
    concurrency:
      group: ui-screenshots-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PREVIEW_URL: ${{ needs.build-deploy.outputs.deploy_url }}
      UI_REVIEW_REPORT_DIR: ${{ github.workspace }}/ui-review-report
      UI_REVIEW_MAX_ROUTES: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tt-players/mobile exec playwright install chromium

      - name: Wait for Netlify preview
        run: |
          set -euo pipefail
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Invalid preview URL: $PREVIEW_URL" >&2; exit 64 ;;
          esac
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$PREVIEW_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Preview did not become ready: $PREVIEW_URL" >&2
          exit 1

      - name: Record host resources before
        run: |
          rm -rf ui-review-report test-results
          mkdir -p ui-review-report/diagnostics
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            hostname
            uname -a
            free -h
            df -h
          } > ui-review-report/diagnostics/host-before.txt

      - name: Capture UI screenshots
        run: pnpm --filter @tt-players/mobile exec playwright test --config=../../playwright.ui-review.config.ts

      - name: Record host resources after
        if: always()
        run: |
          mkdir -p ui-review-report/diagnostics
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            free -h
            df -h
            ps --sort=-rss -eo pid,ppid,rss,comm,args | head -40 || true
          } > ui-review-report/diagnostics/host-after.txt

      - name: Upload UI review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          retention-days: 14
          path: ui-review-report/

      - name: Deploy UI review report to Netlify
        if: always() && hashFiles('ui-review-report/index.html') != ''
        id: report
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./ui-review-report
          production-branch: main
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "UI review screenshots for PR #${{ github.event.pull_request.number }} (${{ github.sha }})"
          alias: ui-review-pr-${{ github.event.pull_request.number }}
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Comment UI screenshots on PR
        if: always() && steps.report.outputs.deploy-url != ''
        uses: actions/github-script@v7
        env:
          REPORT_URL: ${{ steps.report.outputs.deploy-url }}
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- tt-players-ui-screenshots -->';
            const manifestPath = 'ui-review-report/manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const reportUrl = process.env.REPORT_URL.replace(/\/$/, '');
            const previewUrl = process.env.PREVIEW_URL;
            const shortSha = context.sha.slice(0, 7);
            const byProject = manifest.reduce((acc, item) => {
              acc[item.project] ||= [];
              acc[item.project].push(item);
              return acc;
            }, {});
            const sections = Object.entries(byProject).map(([project, items]) => {
              const images = items.map((item) => [
                `#### ${project}: ${item.title}`,
                `[Open page](${item.url})`,
                `![${project} ${item.title}](${reportUrl}/${item.path}?sha=${context.sha})`,
              ].join('\n\n')).join('\n\n');
              return `### ${project}\n\n${images}`;
            }).join('\n\n');
            const body = [
              marker,
              '## UI screenshots',
              '',
              `Preview: ${previewUrl}`,
              `Report: ${reportUrl}`,
              `Commit: \`${shortSha}\``,
              '',
              sections,
              '',
              '_This comment is updated on each same-repository PR run._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  main-ui-audit:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build-deploy.outputs.deploy_url != ''
    needs: build-deploy
    continue-on-error: true
    runs-on: [self-hosted, Linux, ARM64, docker-ui-screenshot, playwright]
    timeout-minutes: 60
    concurrency:
      group: main-ui-audit
      cancel-in-progress: true
    env:
      PREVIEW_URL: ${{ needs.build-deploy.outputs.deploy_url }}
      UI_REVIEW_REPORT_DIR: ${{ github.workspace }}/ui-review-report
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      UI_AUDIT_EMAIL: ${{ secrets.UI_AUDIT_EMAIL }}
      UI_AUDIT_PASSWORD: ${{ secrets.UI_AUDIT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @tt-players/mobile exec playwright install chromium

      - name: Wait for main deployment
        run: |
          set -euo pipefail
          case "$PREVIEW_URL" in
            https://*) ;;
            *) echo "Invalid deployment URL: $PREVIEW_URL" >&2; exit 64 ;;
          esac
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$PREVIEW_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Main deployment did not become ready: $PREVIEW_URL" >&2
          exit 1

      - name: Record host resources before
        run: |
          rm -rf ui-review-report test-results
          mkdir -p ui-review-report/diagnostics
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            hostname
            uname -a
            free -h
            df -h
          } > ui-review-report/diagnostics/host-before.txt

      - name: Run main UI audit
        run: pnpm --filter @tt-players/mobile exec playwright test --config=../../playwright.main-audit.config.ts

      - name: Record host resources after
        if: always()
        run: |
          mkdir -p ui-review-report/diagnostics
          {
            date -u +"%Y-%m-%dT%H:%M:%SZ"
            free -h
            df -h
            ps --sort=-rss -eo pid,ppid,rss,comm,args | head -40 || true
          } > ui-review-report/diagnostics/host-after.txt

      - name: Upload main UI audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-ui-audit-${{ github.sha }}
          retention-days: 30
          path: ui-review-report/

      - name: Add main UI audit summary
        if: always()
        run: |
          {
            echo "## Main UI audit"
            echo
            echo "- Deployment: $PREVIEW_URL"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Report: uploaded as a GitHub Actions artifact"
          } >> "$GITHUB_STEP_SUMMARY"
