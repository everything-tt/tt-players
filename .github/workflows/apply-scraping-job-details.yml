name: Apply scraping job detail changes

on:
  push:
    branches:
      - feat/scraping-job-details

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scraping-job-details

      - name: Apply changes
        run: python scripts/apply-scraping-job-details.py

      - name: Commit changes
        run: |
          rm scripts/apply-scraping-job-details.py
          rm .github/workflows/apply-scraping-job-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show scraping queue job details"
          git push origin HEAD:feat/scraping-job-details
