name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/design-system/**'
      - 'playwright.main-audit.config.ts'
      - 'scripts/check-design-system-usage.mjs'
      - 'scripts/generate-match-record-migration.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/design-system/**'
      - 'playwright.main-audit.config.ts'
      - 'scripts/check-design-system-usage.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate migration sources
        run: node scripts/generate-match-record-migration.mjs

      - name: Upload migration sources
        uses: actions/upload-artifact@v4
        with:
          name: match-record-migration-${{ github.sha }}
          retention-days: 1
          path: generated-match-record-migration/

      - name: Commit generated sources
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'github-actions[bot]'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cp generated-match-record-migration/apps/mobile/src/H2HTabContent.tsx apps/mobile/src/H2HTabContent.tsx
          cp generated-match-record-migration/apps/mobile/src/EventDetailPage.tsx apps/mobile/src/EventDetailPage.tsx
          cp generated-match-record-migration/apps/mobile/src/player-shared.ts apps/mobile/src/player-shared.ts
          git add apps/mobile/src/H2HTabContent.tsx apps/mobile/src/EventDetailPage.tsx apps/mobile/src/player-shared.ts
          if git diff --cached --quiet; then
            echo "Generated sources already committed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat: migrate H2H and tournament match records"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check design-system usage
        run: pnpm check:design-system

      - name: Build mobile app
        run: pnpm mobile:build

      - name: Run mobile tests
        run: pnpm --filter @tt-players/mobile test -- --passWithNoTests

      - name: Validate main audit collection
        run: pnpm --filter @tt-players/mobile exec playwright test --config=../../playwright.main-audit.config.ts --list

      - name: Reject fake action links
        shell: bash
        run: |
          if grep -R --line-number --include='*.tsx' --include='*.ts' 'href="#"' apps/mobile/src; then
            echo 'Use buttons for actions and real links for navigation.'
            exit 1
          fi
