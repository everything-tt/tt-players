name: Apply completed event pagination fix

on:
  push:
    branches:
      - fix/completed-events-avoid-exact-count
    paths:
      - '.github/workflows/completed-events-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/completed-events-avoid-exact-count
          fetch-depth: 0

      - name: Apply source changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, content) {
            fs.writeFileSync(path, content);
          }

          function replaceOnce(content, before, after, label) {
            const first = content.indexOf(before);
            if (first < 0) throw new Error(`Missing replacement anchor: ${label}`);
            if (content.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Replacement anchor is not unique: ${label}`);
            }
            return content.slice(0, first) + after + content.slice(first + before.length);
          }

          const routePath = 'apps/api/src/routes/events.ts';
          let route = read(routePath);

          route = replaceOnce(route, `const ListResponseSchema = z.object({
              data: z.array(EventItemSchema),
              total: z.number().int(),
              limit: z.number().int(),
              offset: z.number().int(),
          });`, `const ListResponseSchema = z.object({
              data: z.array(EventItemSchema),
              total: z.number().int().nullable(),
              limit: z.number().int(),
              offset: z.number().int(),
              has_more: z.boolean(),
          });`, 'list response schema');

          route = replaceOnce(route, `    saved_ids: SavedIdsSchema.optional(),
              limit: z.coerce.number().int().min(1).max(100).default(20),`, `    saved_ids: SavedIdsSchema.optional(),
              include_total: z.enum(['true', 'false'])
                  .optional()
                  .transform((value) => value !== 'false'),
              limit: z.coerce.number().int().min(1).max(100).default(20),`, 'include_total query parameter');

          route = replaceOnce(route, `function applyEventFilters<T>(builder: T, query: EventQuery): T {`, `interface EventFilterOptions {
              includeCompletedResults?: boolean;
          }

          function applyEventFilters<T>(
              builder: T,
              query: EventQuery,
              options: EventFilterOptions = {},
          ): T {`, 'event filter options');

          route = replaceOnce(route, `        if (query.status === 'completed') {`, `        if (query.status === 'completed' && options.includeCompletedResults !== false) {`, 'completed result eligibility option');

          route = replaceOnce(route, `    return ordered as T;
          }

          function calendarPayloadField`, `    return ordered as T;
          }

          interface EventPage {
              pageIds: string[];
              total: number | null;
              hasMore: boolean;
          }

          async function fetchExactEventPage(
              db: Kysely<any>,
              query: EventQuery,
          ): Promise<EventPage> {
              let pageBuilder = db
                  .selectFrom('competitions as c')
                  .select([
                      'c.id',
                      sql<number>\`count(*) over()\`.as('total'),
                  ]);
              pageBuilder = applyEventFilters(pageBuilder, query);
              pageBuilder = applyEventOrdering(pageBuilder, query);

              const pageRows = await pageBuilder
                  .limit(query.limit)
                  .offset(query.offset)
                  .execute();
              const pageIds = pageRows.map((row: { id: string }) => row.id);

              let total = pageRows.length > 0
                  ? Number((pageRows[0] as { total: number | string }).total)
                  : 0;

              if (pageRows.length === 0 && query.offset > 0) {
                  let countBuilder = db
                      .selectFrom('competitions as c')
                      .select(db.fn.countAll().as('count'));
                  countBuilder = applyEventFilters(countBuilder, query);
                  const countRes = await countBuilder.executeTakeFirst();
                  total = Number(countRes?.count ?? 0);
              }

              return {
                  pageIds,
                  total,
                  hasMore: query.offset + pageIds.length < total,
              };
          }

          async function fetchFastEventPage(
              db: Kysely<any>,
              query: EventQuery,
          ): Promise<EventPage> {
              if (query.status !== 'completed') {
                  let pageBuilder = db
                      .selectFrom('competitions as c')
                      .select('c.id');
                  pageBuilder = applyEventFilters(pageBuilder, query);
                  pageBuilder = applyEventOrdering(pageBuilder, query);

                  const pageRows = await pageBuilder
                      .limit(query.limit + 1)
                      .offset(query.offset)
                      .execute();

                  return {
                      pageIds: pageRows
                          .slice(0, query.limit)
                          .map((row: { id: string }) => row.id),
                      total: null,
                      hasMore: pageRows.length > query.limit,
                  };
              }

              const targetEligibleCount = query.offset + query.limit + 1;
              const batchSize = Math.min(
                  500,
                  Math.max(100, targetEligibleCount * 2),
              );
              const eligibleIds: string[] = [];
              let candidateOffset = 0;

              while (eligibleIds.length < targetEligibleCount) {
                  let candidateBuilder = db
                      .selectFrom('competitions as c')
                      .select('c.id');
                  candidateBuilder = applyEventFilters(candidateBuilder, query, {
                      includeCompletedResults: false,
                  });
                  candidateBuilder = applyEventOrdering(candidateBuilder, query);

                  const candidateRows = await candidateBuilder
                      .limit(batchSize)
                      .offset(candidateOffset)
                      .execute();
                  const candidateIds = candidateRows.map((row: { id: string }) => row.id);

                  if (candidateIds.length === 0) break;
                  candidateOffset += candidateIds.length;

                  const eligibleRows = await db
                      .selectFrom('fixtures as f')
                      .innerJoin('rubbers as r', 'r.fixture_id', 'f.id')
                      .select('f.competition_id as id')
                      .where('f.competition_id', 'in', candidateIds)
                      .where('f.deleted_at', 'is', null)
                      .where('r.deleted_at', 'is', null)
                      .where('r.is_doubles', '=', false)
                      .groupBy('f.competition_id')
                      .execute();
                  const eligibleSet = new Set(
                      eligibleRows.map((row: { id: string }) => row.id),
                  );

                  for (const id of candidateIds) {
                      if (eligibleSet.has(id)) eligibleIds.push(id);
                  }

                  if (candidateIds.length < batchSize) break;
              }

              return {
                  pageIds: eligibleIds.slice(query.offset, query.offset + query.limit),
                  total: null,
                  hasMore: eligibleIds.length > query.offset + query.limit,
              };
          }

          function calendarPayloadField`, 'event page helpers');

          const listStart = route.indexOf('                // Match and page lightweight tournament IDs first.');
          const enrichmentStart = route.indexOf('                const enrichedRows = await db', listStart);
          if (listStart < 0 || enrichmentStart < 0) {
            throw new Error('Could not locate list pagination block');
          }
          const newListBlock = `                const page = query.include_total
                      ? await fetchExactEventPage(db, query)
                      : await fetchFastEventPage(db, query);
                  const { pageIds, total, hasMore } = page;

                  if (pageIds.length === 0) {
                      return {
                          data: [],
                          total,
                          limit: query.limit,
                          offset: query.offset,
                          has_more: hasMore,
                      };
                  }

          `;
          route = route.slice(0, listStart) + newListBlock + route.slice(enrichmentStart);

          route = replaceOnce(route, `                    offset: query.offset,
                  };
              },
          );`, `                    offset: query.offset,
                      has_more: hasMore,
                  };
              },
          );`, 'list response has_more');

          write(routePath, route);

          const apiTestPath = 'apps/api/src/__tests__/events-pagination.integration.test.ts';
          let apiTest = read(apiTestPath);
          apiTest = replaceOnce(apiTest, `        expect(firstPage.body.total).toBe(3);`, `        expect(firstPage.body.total).toBe(3);
                  expect(firstPage.body.has_more).toBe(true);`, 'exact first page has_more');
          apiTest = replaceOnce(apiTest, `        expect(secondPage.body.total).toBe(3);
                  expect(secondPage.body.data).toHaveLength(1);`, `        expect(secondPage.body.total).toBe(3);
                  expect(secondPage.body.has_more).toBe(false);
                  expect(secondPage.body.data).toHaveLength(1);`, 'exact second page has_more');
          apiTest = replaceOnce(apiTest, `    it('preserves the total for an out-of-range offset', async () => {`, `    it('returns fast completed pages without scanning for an exact total', async () => {
                  const firstPage = await request
                      .get('/api/events?status=completed&q=Page%20First&include_total=false&limit=2&offset=0')
                      .expect(200);

                  expect(firstPage.body).toMatchObject({
                      total: null,
                      has_more: true,
                      limit: 2,
                      offset: 0,
                  });
                  expect(firstPage.body.data.map((event: { id: string }) => event.id)).toEqual([
                      eventIds[2],
                      eventIds[1],
                  ]);
                  expect(firstPage.body.data.map((event: { match_count: number }) => event.match_count)).toEqual([3, 2]);

                  const finalPage = await request
                      .get('/api/events?status=completed&q=Page%20First&include_total=false&limit=2&offset=2')
                      .expect(200);

                  expect(finalPage.body).toMatchObject({
                      total: null,
                      has_more: false,
                      limit: 2,
                      offset: 2,
                  });
                  expect(finalPage.body.data).toHaveLength(1);
                  expect(finalPage.body.data[0]).toMatchObject({
                      id: eventIds[0],
                      match_count: 1,
                  });
              });

              it('preserves the total for an out-of-range offset', async () => {`, 'fast page integration test');
          apiTest = replaceOnce(apiTest, `            offset: 10,
                  });`, `            offset: 10,
                      has_more: false,
                  });`, 'out of range has_more');
          write(apiTestPath, apiTest);

          const shapeTestPath = 'apps/api/src/__tests__/events-pagination-query-shape.test.ts';
          let shapeTest = read(shapeTestPath);
          shapeTest = replaceOnce(shapeTest, `    it('does not run the expensive metadata selection in the candidate query', () => {`, `    it('uses bounded candidate batches for fast completed pagination', () => {
                  expect(routeSource).toContain('fetchFastEventPage');
                  expect(routeSource).toContain('includeCompletedResults: false');
                  expect(routeSource).toContain(".where('f.competition_id', 'in', candidateIds)");
                  expect(routeSource).toContain('.limit(batchSize)');
              });

              it('does not run the expensive metadata selection in the candidate query', () => {`, 'fast query shape test');
          write(shapeTestPath, shapeTest);

          const pagedPath = 'apps/mobile/src/paged-search.ts';
          let paged = read(pagedPath);
          paged = replaceOnce(paged, `  total?: number | string;`, `  total?: number | string | null;`, 'nullable paged total');
          paged = replaceOnce(paged, `function finiteNumber(value: number | string | undefined): number | null {
            if (value === undefined) return null;`, `function finiteNumber(value: number | string | null | undefined): number | null {
            if (value === undefined || value === null) return null;`, 'nullable finite number');
          paged = replaceOnce(paged, `  if (normalizedCategories.length > 0) params.set('categories', normalizedCategories.join(','));
            params.set('limit', String(limit));`, `  if (normalizedCategories.length > 0) params.set('categories', normalizedCategories.join(','));
            params.set('include_total', 'false');
            params.set('limit', String(limit));`, 'fast tournament list parameter');
          write(pagedPath, paged);

          const pagedTestPath = 'apps/mobile/src/paged-search.test.ts';
          let pagedTest = read(pagedTestPath);
          pagedTest = pagedTest.replace(
            '&categories=junior%2Cwomen&limit=10&offset=10',
            '&categories=junior%2Cwomen&include_total=false&limit=10&offset=10',
          );
          pagedTest = pagedTest.replace(
            '/events?status=upcoming&limit=10&offset=0',
            '/events?status=upcoming&include_total=false&limit=10&offset=0',
          );
          write(pagedTestPath, pagedTest);

          const hookPath = 'apps/mobile/src/hooks/useTournamentList.ts';
          let hook = read(hookPath);
          hook = replaceOnce(hook, `import { buildTournamentListPath, mergePageById } from '../paged-search';`, `import {
              buildTournamentListPath,
              mergePageById,
              normalizePagedResponse,
              type PagedResponse,
          } from '../paged-search';`, 'paged response imports');
          hook = replaceOnce(hook, `interface TournamentEventsResponse {
            data: TournamentEventItem[];
            total: number;
            limit: number;
            offset: number;
          }`, `type TournamentEventsResponse = PagedResponse<TournamentEventItem>;`, 'tournament response type');
          hook = replaceOnce(hook, `  const [total, setTotal] = useState(0);`, `  const [total, setTotal] = useState(0);
            const [hasMore, setHasMore] = useState(false);`, 'has more state');
          hook = replaceOnce(hook, `    setTotal(0);
            }, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);`, `    setTotal(0);
              setHasMore(false);
            }, [categoriesKey, normalizedSearch, status, savedKey, pageSize]);`, 'reset has more');
          hook = replaceOnce(hook, `  useEffect(() => {
            if (!query.data) return;
            setTotal(query.data.total);
            setItems((previous) => mergePageById(previous, query.data!.data, offset === 0));
          }, [offset, query.data]);

            const hasMore = items.length < total;`, `  useEffect(() => {
            if (!query.data) return;
            const page = normalizePagedResponse(query.data, offset);
            setHasMore(page.hasMore);
            setTotal(page.total ?? offset + page.data.length + (page.hasMore ? 1 : 0));
            setItems((previous) => mergePageById(previous, page.data, offset === 0));
          }, [offset, query.data]);`, 'normalize tournament response');
          write(hookPath, hook);

          fs.rmSync('.github/workflows/completed-events-diagnostic.yml');
          NODE

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Mobile tests
        run: pnpm --filter @tt-players/mobile test

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Wudong Liu'
          git config user.email 'wudong.liu@gmail.com'
          git add apps/api apps/mobile .github/workflows/completed-events-diagnostic.yml
          git commit -m 'fix(api): bound completed event eligibility scans'
          git push origin HEAD:fix/completed-events-avoid-exact-count
