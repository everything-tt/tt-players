name: Backend CI

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'packages/db/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'infra/**'
      - 'scripts/migrate-vps-postgres.sh'
      - 'scripts/deploy-vps-release.sh'
      - 'scripts/rollback-vps-release.sh'
      - 'packages/db/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/vps-deploy.yml'
      - '.github/workflows/vps-rollback.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend quality gate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: pnpm run check:backend

      - name: Validate VPS scripts
        run: |
          bash -n scripts/deploy-vps-release.sh
          bash -n scripts/rollback-vps-release.sh
