name: Design System Package

on:
  pull_request:
    paths:
      - 'packages/design-system/**'
  push:
    branches: [main]
    paths:
      - 'packages/design-system/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: design-system-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wudong'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable package
        run: pnpm --filter @tt-players/design-system build

      - name: Inspect package contents
        run: npm pack ./packages/design-system/dist --dry-run

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./packages/design-system/dist/package.json').name")
          PACKAGE_VERSION=$(node -p "require('./packages/design-system/dist/package.json').version")

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists. Bump packages/design-system/package.json before publishing another package change."
            exit 1
          fi

          npm publish ./packages/design-system/dist --registry=https://npm.pkg.github.com
